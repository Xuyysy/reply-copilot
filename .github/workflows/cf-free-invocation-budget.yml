name: CF Free offline invocation budgets
on:
  push:
    branches: ['chatgpt/cf-free-invocation-budget-20261126']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [select, legacy]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix api ci
      - run: node api/scripts/cf-free-invocation-budget/run.mjs ${{ matrix.mode }} "$RUNNER_TEMP/budget.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-invocation-budget-${{ matrix.mode }}
          path: ${{ runner.temp }}/budget.json
