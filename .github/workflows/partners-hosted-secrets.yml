name: Partners hosted login (protected QA secrets)
on:
  push:
    branches: ['chatgpt/partners-staging-qa-20261125']
permissions:
  contents: read
concurrency:
  group: partners-hosted-qa-secrets
  cancel-in-progress: false
jobs:
  login:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' && github.ref == 'refs/heads/chatgpt/partners-staging-qa-20261125' && startsWith(github.event.head_commit.message, 'ci-lite: qa-hosted approved')
    environment: partners-qa
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # No checkout, install scripts, artifact upload, PR execution, OIDC,
      # Cloudflare API token or shared environment credentials in this job.
      - name: Seven real hosted logins, reauth, permissions and logout
        env:
          PARTNERS_QA_CREDENTIALS: ${{ secrets.PARTNERS_QA_CREDENTIALS }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const origin='https://reply-copilot-api-partners-qa.yyx0149.workers.dev';
          const ids=['qa-admin','qa-partner-a','qa-buyer-b','qa-buyer-c','qa-outsider-d','qa-excluded-e','qa-partner-f'];
          const check=(ok,label)=>{if(!ok)throw Error(label);};
          async function main(){
            let g;
            try{g=JSON.parse(process.env.PARTNERS_QA_CREDENTIALS||'null');}catch{throw Error('invalid protected environment secret');}
            check(g&&/^[a-f0-9]{64}$/.test(g.access)&&Array.isArray(g.accounts)&&g.accounts.length===7,'missing or invalid protected QA credentials');
            const accounts=new Map();
            for(const a of g.accounts){
              check(ids.includes(a.id)&&!accounts.has(a.id)&&a.email===a.id+'@example.test'&&/^[a-f0-9]{64}$/.test(a.password),'invalid QA account list');
              accounts.set(a.id,a);
            }
            check(new Set([g.access,...g.accounts.map(a=>a.password)]).size===8,'credentials must be distinct');
            const outer='Basic '+Buffer.from('qa:'+g.access).toString('base64');
            const req=async(path,{method='GET',body,cookie,csrf,source=origin,auth=true}={})=>{
              check(path.startsWith('/')&&!path.startsWith('//'),'invalid path');
              const r=await fetch(origin+path,{method,redirect:'manual',signal:AbortSignal.timeout(15000),headers:{Origin:source,...(auth?{Authorization:outer}:{}),...(cookie?{Cookie:cookie}:{}),...(csrf?{'X-CSRF-Token':csrf,'X-Reply-Copilot-Action':'1'}:{}),...(body!==undefined?{'Content-Type':'application/json'}:{})},...(body!==undefined?{body:JSON.stringify(body)}:{})});
              return {status:r.status,headers:r.headers,text:await r.text()};
            };
            const expect=(r,status,label)=>check(r.status===status,label+' HTTP '+r.status+' expected '+status);
            const body=r=>{try{return JSON.parse(r.text);}catch{throw Error('invalid JSON response');}};
            for(const path of ['/','/account/','/admin/','/login/','/v1/partners/me'])expect(await req(path,{auth:false}),401,'outer gate '+path);
            for(const path of ['/','/account/','/admin/','/login/']){
              const x=await req(path);expect(x,200,'HTML '+path);check(/<!DOCTYPE html>|astro-island/i.test(x.text),'HTML document required');
            }
            for(const path of ['/v1/auth/register','/v1/auth/request-password-reset','/v1/boltutil/orders','/v1/admin/payment-platform-check','/v1/subscriptions/orders']){
              expect(await req(path,{method:'POST',body:{}}),403,'provider/registration route blocked');
            }
            const admin=accounts.get('qa-admin');
            expect(await req('/v1/auth/login',{method:'POST',body:{identity:admin.email,password:admin.password},source:'https://wrong.example.test'}),403,'origin check');
            expect(await req('/v1/auth/login',{method:'POST',body:{identity:admin.email,password:'incorrect-qa-only'}}),401,'bad password');
            const open=[];
            try{
              for(const id of ids){
                const a=accounts.get(id);
                const login=await req('/v1/auth/login',{method:'POST',body:{identity:a.email,password:a.password}});
                expect(login,200,'login '+id);
                const set=login.headers.get('set-cookie')||'';
                check(/^rc_session=/.test(set)&&/HttpOnly/i.test(set)&&/Secure/i.test(set)&&/SameSite=Lax/i.test(set),'session cookie attributes');
                const cookie=set.split(';')[0];
                const session={id,cookie,csrf:null};open.push(session);
                const cr=await req('/v1/auth/csrf',{cookie});expect(cr,200,'CSRF '+id);session.csrf=body(cr).csrfToken;check(typeof session.csrf==='string'&&session.csrf.length>20,'CSRF missing');
                expect(await req('/v1/me',{cookie}),200,'account '+id);
                const partner=await req('/v1/partners/me',{cookie});expect(partner,200,'partner '+id);check(body(partner).enabled===false,'QA program must remain off during login acceptance');
                expect(await req('/v1/admin/partners/policy?q=qa-partner-a',{cookie}),id==='qa-admin'?200:403,'role '+id);
                if(id==='qa-admin'){
                  expect(await req('/v1/admin/reauth',{method:'POST',body:{password:a.password},cookie}),403,'reauth without CSRF');
                  expect(await req('/v1/admin/reauth',{method:'POST',body:{password:a.password},cookie,csrf:session.csrf}),200,'admin reauth');
                }else expect(await req('/v1/admin/reauth',{method:'POST',body:{password:a.password},cookie,csrf:session.csrf}),403,'ordinary user reauth denied');
                expect(await req('/v1/auth/logout',{method:'POST',body:{},cookie}),403,'logout without CSRF');
                const logout=await req('/v1/auth/logout',{method:'POST',body:{},cookie,csrf:session.csrf});expect(logout,200,'logout '+id);
                expect(await req('/v1/me',{cookie}),401,'revoked '+id);open.pop();
                console.log('QA_HOSTED_LOGIN_PASS '+id);
              }
            }finally{
              for(const s of open){
                try{if(!s.csrf){const x=await req('/v1/auth/csrf',{cookie:s.cookie});s.csrf=body(x).csrfToken;}await req('/v1/auth/logout',{method:'POST',body:{},cookie:s.cookie,csrf:s.csrf});}catch{console.error('QA session cleanup needs operator review for '+s.id);}
              }
            }
            console.log('QA_HOSTED_LOGIN_MATRIX_PASS: HTML, private gate, seven password logins, reauth, CSRF, role isolation, logout, blocked routes. Financial/browser acceptance still required.');
          }
          main().catch(e=>{console.error('QA_HOSTED_LOGIN_FAIL '+(e instanceof Error&&/^[A-Za-z0-9 :_+./-]{1,150}$/.test(e.message)?e.message:'redacted failure'));process.exitCode=1;});
          JS
