name: Approved Staging subscription checkout for all authenticated users
on:
  push:
    branches: [chatgpt/staging-subscription-payment-pilot-20261109]
    paths: [.github/workflows/staging-mk99-subscriptions-all-users-once.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: xrh-staging-subscription-payments-20261109
  cancel-in-progress: false
jobs:
  verify:
    name: Scope and full same-SHA CI
    if: >-
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.ref == 'refs/heads/chatgpt/staging-subscription-payment-pilot-20261109' &&
      github.event.head_commit.message == 'ops(staging): execute approved all-users subscription checkout release'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require exactly the approved Staging config and workflow changes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          files="$(git diff --name-only daf71d8baf598f17fd76fd21f1be7dc00655f1f4 HEAD)"
          expected="$(printf '%s\n' '.github/workflows/staging-mk99-subscriptions-all-users-once.yml' 'api/wrangler.jsonc')"
          test "$files" = "$expected" || { echo 'Unexpected application code changes'; exit 1; }
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const c=JSON.parse(readFileSync('api/wrangler.jsonc','utf8'));
          const s=c.env.staging,p=c.env.production;
          assert.equal(s.name,'reply-copilot-api-staging');
          assert.equal(s.d1_databases[0].database_id,'cd44bb44-b525-42c4-b286-2cc84dae7fdb');
          assert.equal(s.vars.ENVIRONMENT,'staging');
          assert.equal(s.vars.API_ORIGIN,'https://api-staging.x-reply-helper.top');
          assert.equal(s.vars.WEB_ORIGIN,'https://staging.x-reply-helper.top');
          for(const k of ['PAYMENTS_ENABLED','SUBSCRIPTIONS_ENABLED','SUBSCRIPTION_PURCHASES_ENABLED','SUBSCRIPTION_CHECKOUT_ENABLED'])assert.equal(s.vars[k],'1');
          assert.equal(p.name,'reply-copilot-api-production');
          for(const k of ['SUBSCRIPTIONS_ENABLED','SUBSCRIPTION_PURCHASES_ENABLED','SUBSCRIPTION_CHECKOUT_ENABLED'])assert.notEqual(p.vars[k],'1');
          assert.ok(!readFileSync('api/src/subscription-checkout.ts','utf8').includes('STAGING_PAYMENT_TEST_USER_EMAIL'),'Disallowed user whitelist');
          console.log('PASS Staging-only sales gate with no account whitelist');
          JS
      - name: Wait for successful exact-SHA Push CI
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 100); do
            data="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=chatgpt%2Fstaging-subscription-payment-pilot-20261109&event=push&per_page=20")"
            line="$(jq -r --arg sha "$SHA" '[.workflow_runs[] | select(.head_sha==$sha and .event=="push")] | first | if .==null then "" else [.id,.status,(.conclusion // "pending")] | join(" ") end' <<< "$data")"
            if [[ -n "$line" ]]; then
              read -r id status conclusion <<< "$line"
              if [[ "$status" = completed ]]; then
                test "$conclusion" = success || { echo "CI failed: $id"; exit 1; }
                echo "PASS immutable SHA $SHA, CI $id";exit 0
              fi
            fi
            sleep 10
          done
          echo 'Exact SHA CI did not succeed';exit 1
  deploy:
    name: Deploy Staging Worker only and verify merchant readiness
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.x-reply-helper.top/pricing/
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install locked tooling
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          npm --prefix api ci
          npm --prefix api run check:staging
          npm --prefix api run typecheck
      - name: Verify exact previous Staging Worker and Pages, 25 Secrets, merchant controls
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/reply-copilot-api-staging/deployments?per_page=1" > "$RUNNER_TEMP/deploy.json"
          jq -e '.success==true and .result.deployments[0].versions[0].version_id=="8e321ad0-6438-41d9-987a-a0c1149c7658" and .result.deployments[0].versions[0].percentage==100' "$RUNNER_TEMP/deploy.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/reply-copilot-api-staging/settings" > "$RUNNER_TEMP/settings.json"
          jq -e '
            .success==true
            and ([.result.bindings[] | select(.type=="d1" and .name=="DB") | .id][0]=="cd44bb44-b525-42c4-b286-2cc84dae7fdb")
            and ([.result.bindings[] | select(.type=="plain_text" and .name=="PAYMENTS_ENABLED") | .text][0]=="1")
            and ([.result.bindings[] | select(.type=="plain_text" and .name=="SUBSCRIPTIONS_ENABLED") | .text][0]=="1")
            and ([.result.bindings[] | select(.type=="plain_text" and .name=="SUBSCRIPTION_PURCHASES_ENABLED") | .text][0]=="0")
            and ([.result.bindings[] | select(.type=="plain_text" and .name=="SUBSCRIPTION_CHECKOUT_ENABLED") | .text][0]=="0")
            and ([.result.bindings[] | select(.type=="secret_text")] | length==25)
            and ([.result.bindings[] | select(.name=="MK99_PROTOCOL_CONFIRMED" or .name=="MK99_AMOUNT_CONTRACT" or .name=="MK99_PRIVATE_KEY" or .name=="MK99_PLATFORM_PUBLIC_KEY")] | length==4)
          ' "$RUNNER_TEMP/settings.json" >/dev/null
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/pages/projects/x-reply-helper-staging/deployments?per_page=1" > "$RUNNER_TEMP/pages.json"
          jq -e '.success==true and .result[0].id=="f7f487ea-fc8e-4f1e-afdf-3bce98701fa9"' "$RUNNER_TEMP/pages.json" >/dev/null
          echo 'PASS exact source and Staging resource/merchant secret binding checks'
      - name: Read-only Staging D1 merchant and schema preflight
        working-directory: api
        shell: bash
        run: |
          set -euo pipefail
          w=./node_modules/.bin/wrangler
          "$w" d1 execute reply-copilot-staging --env staging --remote --command="SELECT (SELECT COUNT(*) FROM d1_migrations) migrations,(SELECT COUNT(*) FROM subscription_orders) orders,(SELECT COUNT(*) FROM subscription_periods) periods" --json > "$RUNNER_TEMP/billing-counts.json"
          "$w" d1 execute reply-copilot-staging --env staging --remote --command="SELECT key,value FROM system_settings WHERE key IN ('active_merchant','purchase_enabled','payment_mk99_enabled','payment_mk99_alipay_enabled','payment_mk99_alipay_released','payment_mk99_wechat_enabled','payment_mk99_wechat_released')" --json > "$RUNNER_TEMP/merchant-flags.json"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';
          const r=(file)=>JSON.parse(readFileSync(process.env.RUNNER_TEMP+'/'+file+'.json','utf8'))[0]?.results;
          const counts=r('billing-counts')?.[0];
          assert.equal(counts?.migrations,24);assert.equal(counts?.orders,0);assert.equal(counts?.periods,0);
          const m=Object.fromEntries((r('merchant-flags')||[]).map(x=>[x.key,x.value]));
          assert.equal(m.active_merchant,'mk99');
          for(const key of ['purchase_enabled','payment_mk99_enabled','payment_mk99_alipay_enabled','payment_mk99_alipay_released','payment_mk99_wechat_enabled','payment_mk99_wechat_released'])assert.equal(m[key],'1',key);
          console.log('PASS schema and MK99 channel release state, no existing paid subscriptions');
          JS
      - name: Deploy Staging Worker with existing Secrets preserved
        working-directory: api
        run: |
          set -euo pipefail
          ./node_modules/.bin/wrangler deploy --env staging --keep-vars --strict
      - name: Verify deployed Staging flags, Secrets and merchant readiness (no purchases)
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/workers/scripts/reply-copilot-api-staging/settings" > "$RUNNER_TEMP/after.json"
          jq -e '
            .success==true
            and ([.result.bindings[] | select(.type=="d1" and .name=="DB") | .id][0]=="cd44bb44-b525-42c4-b286-2cc84dae7fdb")
            and ([.result.bindings[] | select(.type=="plain_text" and (.name=="SUBSCRIPTIONS_ENABLED" or .name=="SUBSCRIPTION_PURCHASES_ENABLED" or .name=="SUBSCRIPTION_CHECKOUT_ENABLED" or .name=="PAYMENTS_ENABLED"))] | length==4 and all(.[];.text=="1"))
            and ([.result.bindings[] | select(.type=="secret_text")] | length==25)
          ' "$RUNNER_TEMP/after.json" >/dev/null
          ready=0
          for i in $(seq 1 25); do
            status="$(curl -sS -o "$RUNNER_TEMP/catalog.json" -w "%{http_code}" --max-time 12 https://api-staging.x-reply-helper.top/v1/subscriptions/plans || true)"
            if [[ "$status" = 200 ]] && jq -e '
              .checkoutAvailable==true and .autoRenew==false
              and ([.plans[] | [.plan_code,.price_fen,.daily_limit,.duration_days]] | sort)==[
                ["basic",6990,500,30],["max",17990,1500,30],
                ["pro",11990,1000,30],["ultra",25990,2000,30]
              ]
              and ([.paymentMethods[] | select(.provider=="mk99")]|length)>0
            ' "$RUNNER_TEMP/catalog.json" >/dev/null 2>&1; then ready=1;break;fi
            sleep 4
          done
          test "$ready" = 1 || { echo 'Merchant readiness unavailable; checkout NOT approved as verified';exit 1; }
          status="$(curl -sS -o "$RUNNER_TEMP/no-session.json" -w "%{http_code}" --max-time 12 -X POST https://api-staging.x-reply-helper.top/v1/subscriptions/orders -H 'Origin: https://staging.x-reply-helper.top' -H 'Content-Type: application/json' --data '{}')"
          test "$status" = 401 || { echo "Session guard unexpected: $status";exit 1; }
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/pages/projects/x-reply-helper-staging/deployments?per_page=1" > "$RUNNER_TEMP/pages-after.json"
          jq -e '.success==true and .result[0].id=="f7f487ea-fc8e-4f1e-afdf-3bce98701fa9"' "$RUNNER_TEMP/pages-after.json" >/dev/null
          echo 'PASS all authenticated Staging users can see MK99 checkout; unauth blocked; no payment submitted'
