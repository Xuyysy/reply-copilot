name: PR119 Staging admin inviter route acceptance
on:
  push:
    branches: [chatgpt/referral119-staging-admin-live-qa-20261113]
permissions:
  contents: read
concurrency:
  group: referral119-staging-admin-qa
  cancel-in-progress: false
jobs:
  admin-referral-smoke:
    if: >-
      github.event_name == 'push' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.ref == 'refs/heads/chatgpt/referral119-staging-admin-live-qa-20261113' &&
      github.actor == 'Xuyysy' &&
      github.event.head_commit.message == 'ci-lite: PR119 staging admin invite smoke approved'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate synthetic admin canInvite and stable URL (no paid AI or emails)
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/referral119-staging-admin-invite-smoke.mjs
