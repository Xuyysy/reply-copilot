name: CF Free offline release evidence review
on:
  push:
    branches: ['chatgpt/cf-free-release-evidence-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test api/tests/cf-free-cloud-business-review.test.mjs api/tests/cf-free-migration-evidence.test.mjs api/tests/cf-free-private-release-gate.test.mjs
