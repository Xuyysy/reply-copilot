name: CF Free offline business route profiles
on:
  push:
    branches:
      - chatgpt/cf-free-rustcrypto-wasm-cloud-20261125
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked local runtime
        run: npm --prefix api ci
      - name: Validate offline pilot evidence assessment
        run: node --test api/tests/cf-free-cloud-pilot-assessment.test.mjs
      - name: Profile actual API routes with fresh local D1 and mock AI
        run: node api/scripts/cf-free-offline-route-profiles.mjs
