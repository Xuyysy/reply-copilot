name: Approved one-shot Production Worker + Pages release (2026-11-10)

# User explicitly approved a single coordinated release. This file is created
# in one isolated main-branch commit and is NOT a general-purpose deploy trigger.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/production-one-shot-20261110.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: reply-copilot-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Validate exact once-only approved source and immutable successful builds
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      startsWith(github.event.head_commit.message, 'ops(production): approved one-shot Worker and Pages release')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Deny any unexpected code or concurrent workflow change
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse HEAD^)" = '4dbeb29c9a568e3803a3345f82fa5e520d423504'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/production-one-shot-20261110.yml'
          git diff --check HEAD^ HEAD
          echo 'PASS: exact one-shot control file; all application code remains unchanged.'
      - name: Verify immutable release branch CI, build and passed read-only preflight
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=9bcaf78d290771af3a775862938b0b4291621501
          for pair in '42773302460:.github/workflows/ci.yml' '42773302749:.github/workflows/production-build.yml'; do
            run="${pair%%:*}"
            path="${pair#*:}"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run" |
              jq -e --arg sha "$sha" --arg path "$path" --arg repo "$GITHUB_REPOSITORY" '
                .head_sha==$sha and .head_repository.full_name==$repo
                and .head_branch=="release/production" and .event=="push"
                and .status=="completed" and .conclusion=="success" and .path==$path
              ' >/dev/null
          done
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/42774324175" |
            jq -e '
              .event=="workflow_dispatch"
              and .head_branch=="main"
              and .status=="completed"
              and .conclusion=="success"
              and .actor.login=="Xuyysy"
              and .path==".github/workflows/production-deploy.yml"
            ' >/dev/null
          echo "PASS: source $sha, successful full CI, immutable Production build and read-only preflight."

  release:
    name: Deploy and verify Worker, then Pages, in one protected Production run
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    environment:
      name: production
      url: https://app.x-reply-helper.top
    env:
      SOURCE_SHA: 9bcaf78d290771af3a775862938b0b4291621501
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET: worker
      EXPECTED_CURRENT: 0b492639-88df-4b04-aee1-5471f231a0e1
    steps:
      - name: Require protected Production credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch immutable, independently verified Production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-9bcaf78d290771af3a775862938b0b4291621501
          run-id: 42773302749
          github-token: ${{ github.token }}
          path: release
      - name: Verify exact source, all artifact digests and Production-only identity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify-production-artifact.py release "$SOURCE_SHA"
      - name: Verify existing Pages rollback point before changing either component
        env:
          TARGET: pages
          EXPECTED_CURRENT: e4edc11d-7cac-4dc6-bf68-9978e1475ed3
        run: python3 scripts/guard-production-release.py before
      - name: Verify existing Worker rollback point and preserve bindings before writes
        run: python3 scripts/guard-production-release.py before
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated pinned Wrangler without updating any application dependency
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/production-deploy-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.0
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" --version
      - name: Prepare only the hashed, precompiled Production Worker bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          config=json.loads(pathlib.Path('release/worker-config.json').read_text())
          assert config['name']=='reply-copilot-api-production'
          config['main']=str(pathlib.Path('release/worker/index.js').resolve())
          config.pop('$schema',None)
          for db in config.get('d1_databases',[]):
              db.pop('migrations_dir',None)
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'production.wrangler.json').write_text(json.dumps(config))
          PY
      - name: Deploy Production Worker first; preserve live vars, secrets, payment handlers
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" deploy \
            --config "$RUNNER_TEMP/production.wrangler.json" \
            --no-bundle --keep-vars --strict
      - name: Verify Worker changed version and all original bindings remain identical
        run: python3 scripts/guard-production-release.py after
      - name: Smoke-check Worker health, verified subscription catalog and paid auth gate
        shell: bash
        run: |
          set -euo pipefail
          api=https://api.x-reply-helper.top
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$api/health" | jq -e '.ok == true' >/dev/null
          curl --fail --silent --show-error --retry 6 --retry-all-errors "$api/v1/subscriptions/plans" |
            jq -e '(.plans | type == "array") and .autoRenew == false' >/dev/null
          code=$(curl --silent --show-error --retry 6 --retry-all-errors \
            --output "$RUNNER_TEMP/unauthorized-insights.json" --write-out '%{http_code}' \
            "$api/v1/creator-momentum/insights")
          test "$code" = 401 || { echo "Unauthenticated paid-only insights returned $code, refusing Pages"; exit 1; }
          echo 'PASS: Production Worker healthy, subscriptions intact, and insights authorization enforced.'
      - name: Verify Pages remains exactly at approved previous deployment after Worker upgrade
        env:
          TARGET: pages
          EXPECTED_CURRENT: e4edc11d-7cac-4dc6-bf68-9978e1475ed3
        run: python3 scripts/guard-production-release.py before
      - name: Deploy matching Production Pages from the SAME signed and hashed build
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" pages deploy release/pages \
            --project-name x-reply-helper-production --branch main \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "Approved coordinated Production Worker+Pages $SOURCE_SHA"
      - name: Verify Pages switched while all payment/secrets/D1 bindings remain unchanged
        env:
          TARGET: pages
          EXPECTED_CURRENT: e4edc11d-7cac-4dc6-bf68-9978e1475ed3
        run: python3 scripts/guard-production-release.py after
      - name: Verify live Pages source SHA and account page HTTP
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-all-errors \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/x-reply-helper-production" |
            jq -e --arg sha "$SOURCE_SHA" '
              .success==true and .result.canonical_deployment.latest_stage.status=="success"
              and .result.canonical_deployment.deployment_trigger.metadata.commit_hash==$sha
            ' >/dev/null
          curl -L --fail --silent --show-error --retry 6 --retry-all-errors \
            https://app.x-reply-helper.top/account/ > "$RUNNER_TEMP/account-post-release.html"
          grep -q 'astro-island' "$RUNNER_TEMP/account-post-release.html"
          echo 'PASS: Production Worker and matching Pages now active; no D1 SQL, payment config or Chrome publish.'
      - name: Record completed two-component release
        if: success()
        shell: bash
        run: |
          echo '### Approved Production Worker + Pages deployment succeeded' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo '- Independent CI: 42773302460 (1024/1024)' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production build: 42773302749' >> "$GITHUB_STEP_SUMMARY"
          echo '- Worker: newly active, health and paid authorization verified' >> "$GITHUB_STEP_SUMMARY"
          echo '- Pages: matching source activated and account page smoke-tested' >> "$GITHUB_STEP_SUMMARY"
          echo '- Existing secret bindings, payment and subscription flags and D1 UUID: preserved' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production D1 migration, Chrome Web Store and payment configuration: not changed' >> "$GITHUB_STEP_SUMMARY"
