name: Owner-approved Production pricing upgrade vs next period Pages-only (#117)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: reply-copilot-production-pricing-choice-117
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release request and independent successful builds
    if: >-
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 117 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/deploy-production-pricing-choices fd4065594cc5d42b05c9c9fbc5dbe539652ca02e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 'fd4065594cc5d42b05c9c9fbc5dbe539652ca02e'
      RELEASE_MODE: deploy
      CI_RUN_ID: '43189104342'
      BUILD_RUN_ID: '43189104348'
      TARGET: pages
      EXPECTED_CURRENT: 'fc9bd60c-8cb1-4fa7-a409-c669132ac64a'
      CONFIRMATION: DEPLOY_PAGES_TO_PRODUCTION
      API_ORIGIN_TAKEOVER: deny
      API_ORIGIN_TAKEOVER_CONFIRMATION: ''
      EXPECTED_DEPLOYMENT: ''
      BASE_SHA: '2d6d7ecc31a9e249473949318a867a135ff55639'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exact immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_CURRENT" =~ ^[0-9a-f-]{36}$ ]] || exit 1
          test "$CI_RUN_ID" != "$BUILD_RUN_ID"
          case "$RELEASE_MODE:$TARGET:$CONFIRMATION" in
            check:worker:CHECK_ONLY|check:pages:CHECK_ONLY|deploy:worker:DEPLOY_WORKER_TO_PRODUCTION|deploy:pages:DEPLOY_PAGES_TO_PRODUCTION) ;;
            *) echo 'Release mode, target or confirmation phrase invalid'; exit 1 ;;
          esac
          # Explicitly opt in to the API-origin -> Wrangler ownership handoff.
          # Default behavior continues to fail closed with Wrangler --strict.
          case "$API_ORIGIN_TAKEOVER" in
            deny)
              test -z "$API_ORIGIN_TAKEOVER_CONFIRMATION" || { echo 'Unexpected source-takeover confirmation'; exit 1; }
              test -z "$EXPECTED_DEPLOYMENT" || { echo 'Unexpected takeover deployment pin'; exit 1; }
              ;;
            approve-after-review)
              test "$RELEASE_MODE:$TARGET" = "deploy:worker" || { echo 'API-origin approval only supported for Worker deployment'; exit 1; }
              test "$API_ORIGIN_TAKEOVER_CONFIRMATION" = "ACKNOWLEDGE_WORKER_SCRIPT_API_SOURCE_OVERWRITE" || { echo 'Missing separate API-origin overwrite approval'; exit 1; }
              [[ "$EXPECTED_DEPLOYMENT" =~ ^[0-9a-f-]{36}$ ]] || { echo 'Missing pinned current Worker deployment ID'; exit 1; }
              ;;
            *) echo 'Invalid API-origin takeover mode'; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/production-ci-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/production-build-run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_repository.full_name == $repo
            and .head_branch == "release/production" and .event == "push"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/ci.yml"
          ' "$RUNNER_TEMP/production-ci-run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_repository.full_name == $repo
            and .head_branch == "release/production" and .event == "push"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/production-build.yml"
          ' "$RUNNER_TEMP/production-build-run.json"

      - name: Confirm exact release branch and six approved Pricing Choices Web-only changes
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/production" --jq '.object.sha')"
          test "$current" = "$SOURCE_SHA" || { echo 'Release/production moved: fail closed'; exit 1; }
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$SOURCE_SHA" > "$RUNNER_TEMP/check-scope.json"
          jq -e '
            .status == "ahead" and .behind_by == 0 and
            ([.files[].filename]|sort) ==
              ["web/src/components/account/SubscriptionCheckout.tsx","web/src/lib/subscription-pricing-choices.d.mts","web/src/lib/subscription-pricing-choices.mjs","web/src/pages/pricing.astro","web/tests/subscription-pricing-choices.test.mjs","web/tests/subscription-website-admin.test.mjs"]
          ' "$RUNNER_TEMP/check-scope.json"
          echo 'PASS: exact six Web-only Pricing Choices changes; no payment/API/Worker code changes'

  release:
    name: Owner-approved Production Pages pricing choices #117
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.x-reply-helper.top
    env:
      SOURCE_SHA: 'fd4065594cc5d42b05c9c9fbc5dbe539652ca02e'
      RELEASE_MODE: deploy
      TARGET: pages
      EXPECTED_CURRENT: 'fc9bd60c-8cb1-4fa7-a409-c669132ac64a'
      EXPECTED_DEPLOYMENT: ''
      API_ORIGIN_TAKEOVER: deny
      API_ORIGIN_TAKEOVER_CONFIRMATION: ''
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Production environment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Production environment credentials missing'; exit 1; }
      - name: Checkout exact trusted main workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify production API-origin guard in isolated offline tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_production_api_origin_guard.py' -v
      - name: Download immutable artifact from independently verified build
        uses: actions/download-artifact@v4
        with:
          name: production-build-fd4065594cc5d42b05c9c9fbc5dbe539652ca02e
          run-id: 43189104348
          github-token: ${{ github.token }}
          path: release
      - name: Validate pinned artifacts and safe Production target
        run: python3 scripts/verify-production-artifact.py release "$SOURCE_SHA"
      - name: Confirm immutable Production Pages bundle contains Pricing and subscription checkout
        shell: bash
        run: |
          set -euo pipefail
          test -f release/pages/pricing/index.html
          test -f release/pages/subscription-checkout/index.html
          test -f release/pages/account/index.html
      - name: Verify CURRENT live Worker and Pages state before deployment
        run: python3 scripts/guard-production-release.py before
      - name: Pin concurrent Production Worker and Staging deployments (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$root/workers/scripts/reply-copilot-api-production/deployments" > "$RUNNER_TEMP/prod-worker-before.json"
          curl -fsS -H "$auth" "$root/workers/scripts/reply-copilot-api-staging/deployments" > "$RUNNER_TEMP/staging-worker-before.json"
          curl -fsS -H "$auth" "$root/pages/projects/x-reply-helper-staging/deployments?per_page=1" > "$RUNNER_TEMP/staging-pages-before.json"
          jq -e --arg id '5c3ab5a2-70d6-41dc-aa94-596b7b1256eb' '.success and .result.deployments[0].id==$id' "$RUNNER_TEMP/prod-worker-before.json"
          jq -e --arg id '53ed6677-5ebc-43da-98f2-9f73fc7d41f6' '.success and .result.deployments[0].id==$id' "$RUNNER_TEMP/staging-worker-before.json"
          jq -e --arg id 'd1dec995-fbf8-4e96-af07-489f187e520c' '.success and .result[0].id==$id' "$RUNNER_TEMP/staging-pages-before.json"

      # The trusted historical main branch has NO api/package.json or api lockfile.
      # Staging already uses an isolated pinned Wrangler install for this reason.
      - uses: actions/setup-node@v4
        if: github.event_name == 'issue_comment'
        with:
          node-version: '24'
      - name: Install pinned isolated Wrangler (no main-branch API dependency)
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/production-deploy-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.0
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" --version
      - name: Deploy ONLY immutable verified Production Pages files
        if: github.event_name == 'issue_comment'
        shell: bash
        run: |
          set -euo pipefail
          # Fail closed if Production Worker/Pages binding or deployment pins changed during preparation.
          python3 scripts/guard-production-release.py before
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" pages deploy release/pages \
            --project-name x-reply-helper-production --branch main \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "Approved Production Pages $SOURCE_SHA"
      - name: Check deployment succeeded AND preserved payment/secret/D1 bindings
        if: github.event_name == 'issue_comment'
        run: python3 scripts/guard-production-release.py after
      - name: Verify Worker/Staging remained untouched and public pricing / subscription routes are available
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$root/workers/scripts/reply-copilot-api-production/deployments" | jq -e --arg id '5c3ab5a2-70d6-41dc-aa94-596b7b1256eb' '.success and .result.deployments[0].id==$id'
          curl -fsS -H "$auth" "$root/workers/scripts/reply-copilot-api-staging/deployments" | jq -e --arg id '53ed6677-5ebc-43da-98f2-9f73fc7d41f6' '.success and .result.deployments[0].id==$id'
          curl -fsS -H "$auth" "$root/pages/projects/x-reply-helper-staging/deployments?per_page=1" | jq -e --arg id 'd1dec995-fbf8-4e96-af07-489f187e520c' '.success and .result[0].id==$id'
          for n in 1 2 3 4 5 6 7 8; do
            html="$(curl -fsSL --max-time 15 https://app.x-reply-helper.top/pricing/)"
            if [[ "$html" == *"legacy-pricing-hero"* ]]; then
              curl -fsSL --max-time 15 https://app.x-reply-helper.top/subscription-checkout/ > /dev/null
              curl -fsSL --max-time 15 https://app.x-reply-helper.top/account/ > /dev/null
              echo 'PASS: Production pricing and subscription checkout reachable; Worker and Staging unchanged'
              exit 0
            fi
            sleep 4
          done
          echo 'Pricing page propagation not verified'; exit 1

      - name: Preflight or release summary
        if: success()
        shell: bash
        run: |
          if [[ "$RELEASE_MODE" == 'check' ]]; then
            echo '### Production preflight passed (READ-ONLY; NOTHING DEPLOYED)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Manually approved Production release completed' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Mode: $RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected previous active ID: $EXPECTED_CURRENT" >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 SQL/migrations, other component and Chrome Web Store: unchanged' >> "$GITHUB_STEP_SUMMARY"
