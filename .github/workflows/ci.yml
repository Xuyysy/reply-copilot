name: Reply Copilot CI

on:
  # Ordinary pushes retain full tests and immutable SHA-pinned release artifacts.
  # Opt-in 'ci-lite:' intermediate commits on non-release branches get a fast
  # check only; final releasable commits MUST omit the prefix and pass full CI.
  push:
    branches: ['**']
  # Always verify the latest PR merge context (including synchronize events),
  # but avoid a second copy of the browser-heavy full suite and release builds.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reply-copilot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-build:
    name: Test, build and package (no deployment)
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      SOURCE_SHA: ${{ github.event_name == 'pull_request' && github.head_ref == 'codex/subscriptions-v1-issue21' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.sha || github.sha }}
      # Never honor the fast-path prefix on protected release/staging namespaces.
      # A fast push does NOT produce artifacts and cannot satisfy a deploy's
      # artifact verification. This flag only applies to the push head commit.
      # A final unmarked commit remains subject to the original complete CI.
      CI_LITE_PUSH: ${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'ci-lite:') && !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/heads/staging/') }}
    steps:
      - name: Checkout full history for regression baselines
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            api/package-lock.json

      - name: Install Chrome for isolated browser tests
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        id: chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable

      # Temporary CI bridge for legacy tests that hard-code macOS paths.
      # Only modifies the disposable GitHub Linux runner, never any user machine.
      - name: Prepare isolated Linux Chrome test compatibility
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        env:
          REAL_CHROME: ${{ steps.chrome.outputs.chrome-path }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-chrome"
          printf '#!/usr/bin/env bash\nexec %q --no-sandbox --disable-dev-shm-usage "$@"\n' "$REAL_CHROME" > "$RUNNER_TEMP/ci-chrome/chrome"
          chmod +x "$RUNNER_TEMP/ci-chrome/chrome"
          sudo mkdir -p "/Applications/Google Chrome.app/Contents/MacOS" /private/tmp
          sudo chmod 1777 /private/tmp
          sudo ln -s "$RUNNER_TEMP/ci-chrome/chrome" "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          "$RUNNER_TEMP/ci-chrome/chrome" --version

      - name: Install exact locked dependencies
        run: |
          npm --prefix web ci
          npm --prefix api ci

      - name: Check Staging environment and TypeScript
        run: |
          npm --prefix api run check:staging
          npm --prefix api run typecheck

      # Full tests are mandatory on normal/final pushes and manual dispatch.
      # ci-lite: intermediate pushes get ONLY focused checks and no artifacts.
      - name: Run full suite and preserve the exit code
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        env:
          CHROME_BINARY: ${{ runner.temp }}/ci-chrome/chrome
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/npm-test.log"
          result=${PIPESTATUS[0]}
          echo "$result" > "$RUNNER_TEMP/npm-test.exit"
          echo "Full npm test exit code: $result"
          exit "$result"

      # PRs validate the synthetic merge context; ci-lite: push commits validate
      # their exact SHA. Neither produces trusted Staging/Production artifacts.
      - name: Verify lightweight PR or intermediate-push context
        if: github.event_name == 'pull_request' || env.CI_LITE_PUSH == 'true'
        run: |
          # Astro supplies ImportMeta.env types through generated .astro/types.d.ts.
          (cd web && npx --no-install astro sync && npx --no-install tsc --noEmit)
          node --test --test-concurrency=1 \
            tests/production-preflight.test.mjs \
            tests/extension-identity.test.js \
            api/tests/payment-config.test.mjs \
            api/tests/subscription-policy.test.mjs \
            api/tests/signup-device-claims.test.mjs

      - name: Build pinned Staging extension
        # Only push artifacts can be promoted by the guarded Staging release.
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        env:
          REPLY_COPILOT_WEBSITE_URL: https://staging.x-reply-helper.top
          REPLY_COPILOT_API_URL: https://api-staging.x-reply-helper.top
        run: npm run build:staging

      - name: Package and fingerprint Web and extension
        # Only push artifacts can be promoted by the guarded Staging release.
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        run: python3 scripts/package-staging-ci.py

      - name: Upload immutable Staging Pages bundle
        # Only push artifacts can be promoted by the guarded Staging release.
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-pages-${{ env.SOURCE_SHA }}
          path: web/dist/
          retention-days: 21
          if-no-files-found: error

      - name: Upload ZIP and provenance manifest
        # Only push artifacts can be promoted by the guarded Staging release.
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-extension-${{ env.SOURCE_SHA }}
          path: dist/ci/
          retention-days: 21
          if-no-files-found: error

      - name: Verify subscription release builds and Web types
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true' && (github.ref == 'refs/heads/codex/subscriptions-v1-issue21' || github.ref == 'refs/heads/chatgpt/subscription-release-integration-20261109')
        env:
          PUBLIC_API_BASE_URL: https://api.x-reply-helper.top
          PUBLIC_TURNSTILE_SITE_KEY: 0x4AAAAAAFhsvhYsTlFR6LIM
        run: |
          (cd web && npx --no-install tsc --noEmit)
          npm --prefix web run build:production
          (cd api && npx --no-install wrangler deploy --env staging --dry-run)
          (cd api && npx --no-install wrangler deploy --config deploy/production.wrangler.json --dry-run)

      - name: Build and fingerprint Production Chrome candidate
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true' && (github.ref == 'refs/heads/codex/chrome-034-release-candidate-v2' || github.ref == 'refs/heads/codex/subscriptions-v1-issue21' || github.ref == 'refs/heads/chatgpt/subscription-release-integration-20261109' || github.ref == 'refs/heads/release/chrome-0311-reply-perf-candidate-20261115')
        env:
          REPLY_COPILOT_WEBSITE_URL: https://app.x-reply-helper.top
          REPLY_COPILOT_API_URL: https://api.x-reply-helper.top
        run: |
          npm run build:production
          python3 scripts/package-production-rc.py

      - name: Validate Chrome 0.3.11 Web Store candidate before artifact upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/release/chrome-0311-reply-perf-candidate-20261115'
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from zipfile import ZipFile
          root=Path('dist/production')
          m=json.loads((root/'manifest.json').read_text())
          key=json.loads(Path('config/extension-store-identity.json').read_text())
          assert m['version']=='0.3.11' and m.get('version_name')=='0.3.11'
          assert m['key']==key['publicKey'] and key['id']=='fgfjajofkapebgphfidblngcjomkbdaj'
          assert m['host_permissions']==['https://api.x-reply-helper.top/*']
          assert m.get('externally_connectable')=={'matches':['https://app.x-reply-helper.top/*']}
          assert not (root/'staging').exists()
          assert 'channel: "production"' in (root/'config/runtime.js').read_text()
          assert (root/'content/content-script.js').exists()
          assert 'mutationTouchesReply' in (root/'content/content-script.js').read_text()
          assert 'causalQuoteAuto' in (root/'content/content-script.js').read_text()
          archive=Path('dist/production-rc/reply-copilot-production-0.3.11.zip')
          provenance=json.loads(Path('dist/production-rc/provenance.json').read_text())
          assert archive.is_file() and provenance['sourceSha']==__import__('os').environ['SOURCE_SHA']
          assert provenance['version']=='0.3.11' and provenance['extensionId']==key['id']
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==provenance['sha256']
          with ZipFile(archive) as z:
            assert z.testzip() is None
            assert json.loads(z.read('manifest.json'))==m
            assert all(not n.startswith(('staging/','dev/')) for n in z.namelist())
          print('PASS: Web Store identity, 0.3.11, Production-only ZIP and pinned SHA')
          PY

      - name: Upload Production Chrome candidate
        if: github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true' && (github.ref == 'refs/heads/codex/chrome-034-release-candidate-v2' || github.ref == 'refs/heads/codex/subscriptions-v1-issue21' || github.ref == 'refs/heads/chatgpt/subscription-release-integration-20261109' || github.ref == 'refs/heads/release/chrome-0311-reply-perf-candidate-20261115')
        uses: actions/upload-artifact@v4
        with:
          name: production-extension-${{ env.SOURCE_SHA }}
          path: dist/production-rc/
          if-no-files-found: error

      - name: Explain lightweight run is not release evidence
        if: github.event_name == 'pull_request' || env.CI_LITE_PUSH == 'true'
        run: |
          echo '### Lightweight validation only' >> "$GITHUB_STEP_SUMMARY"
          echo 'This run did not execute the full browser suite or generate release artifacts.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a releasable source SHA, push a final commit without the ci-lite: prefix and require a green full Push CI.' >> "$GITHUB_STEP_SUMMARY"

      - name: Always save full test logs
        if: always() && github.event_name != 'pull_request' && env.CI_LITE_PUSH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ env.SOURCE_SHA }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/npm-test.log
            ${{ runner.temp }}/npm-test.exit
          if-no-files-found: warn
          retention-days: 21
