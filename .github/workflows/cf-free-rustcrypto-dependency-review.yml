name: CF Free RustCrypto dependency and license review
on:
  push:
    branches: ['chatgpt/cf-free-rustcrypto-dependency-review-20261125']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Collect locked crate license texts and metadata
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cd api/prototypes/cf-free-rustcrypto-wasm
          echo '09a6085dc9e2becfde66d4c013a8f5b2423800513ca8b3af6a6e37f6e632ccc3  Cargo.lock' | sha256sum -c -
          cargo +1.85.1 metadata --locked --format-version 1 > "$RUNNER_TEMP/locked-crates.json"
          mkdir -p "$RUNNER_TEMP/rustcrypto-review/notices"
          python3 - <<'PY'
          import json,os,pathlib,shutil,hashlib
          temp=pathlib.Path(os.environ['RUNNER_TEMP'])
          out=temp/'rustcrypto-review'
          packages=json.loads((temp/'locked-crates.json').read_text())['packages']
          records=[]
          for p in sorted(packages,key=lambda p:(p['name'],p['version'])):
              if not p['source']: continue
              source=pathlib.Path(p['manifest_path']).parent
              dst=out/'notices'/(p['name']+'-'+p['version'])
              dst.mkdir()
              paths=[f for f in source.iterdir() if f.is_file() and not f.is_symlink() and f.name.upper().startswith(('LICENSE','LICENCE','COPYRIGHT','NOTICE','UNLICENSE'))]
              if p['license_file']:
                  declared=(source/p['license_file']).resolve()
                  assert declared.is_relative_to(source.resolve()) and declared.is_file()
                  if declared not in paths: paths.append(declared)
              files=[]
              for f in sorted(paths):
                  shutil.copyfile(f,dst/f.name)
                  files.append({'name':f.name,'sha256':hashlib.sha256(f.read_bytes()).hexdigest()})
              records.append({'name':p['name'],'version':p['version'],'license':p['license'],'repository':p['repository'],'files':files})
          (out/'license-inventory.json').write_text(json.dumps(records,indent=2)+'\n')
          for r in records: print('CF_FREE_LICENSE_NOTICE '+json.dumps(r))
          assert all(r['files'] and r['license'] for r in records), 'Missing license notice requires review'
          PY
      - name: Run pinned official RustSec cargo-audit against entire Cargo.lock
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/audit-bin" "$RUNNER_TEMP/rustcrypto-review"
          curl --fail --silent --show-error --location --retry 2 'https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.23.0/cargo-audit-x86_64-unknown-linux-gnu-v0.23.0.tgz' -o "$RUNNER_TEMP/cargo-audit.tgz"
          echo "b77993532b253fcbf550996d7716465ec3d734d4e74e7f87bfb65a19add0fb59  $RUNNER_TEMP/cargo-audit.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-audit.tgz" -C "$RUNNER_TEMP/audit-bin" --strip-components=1
          export PATH="$RUNNER_TEMP/audit-bin:$PATH"
          cargo audit --version
          cd api/prototypes/cf-free-rustcrypto-wasm
          set +e
          cargo audit --file Cargo.lock --json > "$RUNNER_TEMP/rustcrypto-review/audit.json"
          rc=$?
          set -e
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'rustcrypto-review'/'audit.json'
          data=json.loads(p.read_text())
          print('CF_FREE_RUSTSEC_AUDIT '+json.dumps({'database':data.get('database'),'vulnerabilities':data.get('vulnerabilities'),'warnings':data.get('warnings')}))
          assert isinstance(data.get('vulnerabilities',{}).get('count'),int)
          PY
          exit "$rc"
      - name: Preserve license and advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-verifier-rustcrypto-review
          path: ${{ runner.temp }}/rustcrypto-review
          if-no-files-found: error
          retention-days: 21
