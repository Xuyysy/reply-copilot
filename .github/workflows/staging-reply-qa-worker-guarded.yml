name: Guarded Staging Reply QA Worker check, inactive upload or active deploy
on:
  workflow_dispatch:
    inputs:
      candidate:
        description: Select exact Staging V4, V5, V5.1 or V5.2 candidate (never Production)
        type: choice
        options: ["v4", "v5", "v5.1", "v5.2"]
        default: "v4"
        required: true
      source_sha:
        description: Exact passed Staging candidate PR source SHA
        type: string
        required: true
      ci_run_id:
        description: Successful Staging Reply QA API branch push CI run ID
        type: string
        required: true
      expected_active_version:
        description: Exact current Staging Worker active version UUID
        type: string
        required: true
      expected_active_deployment:
        description: Exact current Staging Worker deployment ID (required for active deploy)
        type: string
        required: false
      mode:
        type: choice
        options: ["check", "upload", "deploy"]
        default: "check"
        required: true
      confirmation:
        description: Exact candidate-specific release confirmation
        type: string
        required: true
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: reply-copilot-staging-reply-qa-worker
  cancel-in-progress: false
jobs:
  check-or-upload:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy'
    environment: staging
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CANDIDATE: ${{ inputs.candidate }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      CI_RUN_ID: ${{ inputs.ci_run_id }}
      EXPECTED: ${{ inputs.expected_active_version }}
      EXPECTED_DEPLOYMENT: ${{ inputs.expected_active_deployment }}
      MODE: ${{ inputs.mode }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate exact successful Staging QA PR and full CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 1
          case "$CANDIDATE" in
            v4)
              case "$MODE:$CONFIRMATION" in
                check:CHECK_ONLY|upload:UPLOAD_STAGING_VERSION_ONLY|deploy:DEPLOY_STAGING_WORKER) ;;
                *) echo 'Missing exact V4 release confirmation'; exit 1 ;;
              esac ;;
            v5)
              case "$MODE:$CONFIRMATION" in
                check:CHECK_V5_ONLY|upload:UPLOAD_STAGING_V5_VERSION_ONLY|deploy:DEPLOY_STAGING_V5_WORKER) ;;
                *) echo 'Missing exact V5 release confirmation'; exit 1 ;;
              esac
              test "$EXPECTED" = "20c4eaa6-85a1-4b2b-a5fa-8648dfeebdf5"
              if [[ "$MODE" == "deploy" ]]; then
                test "$EXPECTED_DEPLOYMENT" = "27b23ad7-37f9-4fab-9ce4-587f1f760ed0"
              fi ;;
            v5.1)
              case "$MODE:$CONFIRMATION" in
                check:CHECK_V51_ONLY|upload:UPLOAD_STAGING_V51_VERSION_ONLY|deploy:DEPLOY_STAGING_V51_WORKER) ;;
                *) echo 'Missing exact V5.1 release confirmation'; exit 1 ;;
              esac
              test "$EXPECTED" = "913ca29f-0784-445d-8cfe-9ada1d817276"
              if [[ "$MODE" == "deploy" ]]; then
                test "$EXPECTED_DEPLOYMENT" = "4861c716-5534-435b-891a-8693ca1150b9"
              fi ;;
            v5.2)
              case "$MODE:$CONFIRMATION" in
                check:CHECK_V52_ONLY|upload:UPLOAD_STAGING_V52_VERSION_ONLY|deploy:DEPLOY_STAGING_V52_WORKER) ;;
                *) echo 'Missing exact V5.2 release confirmation'; exit 1 ;;
              esac
              test "$EXPECTED" = "a78318e8-aeab-4147-a4f4-54a8ef4f93e7"
              if [[ "$MODE" == "deploy" ]]; then
                test "$EXPECTED_DEPLOYMENT" = "6c811259-165e-4e2a-a635-114b0970966b"
              fi ;;
            *) echo 'Unknown candidate'; exit 1 ;;
          esac
          if [[ "$MODE" == "deploy" ]]; then
            [[ "$EXPECTED_DEPLOYMENT" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || exit 1
          else
            test -z "$EXPECTED_DEPLOYMENT" || exit 1
          fi
          test "$CLOUDFLARE_ACCOUNT_ID" = "cb5fc919a9f05dcf39b3ca29c9538a1f"
          test -n "$CLOUDFLARE_API_TOKEN"
          if [[ "$CANDIDATE" == "v4" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-ci.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo
              and .head_branch == "qa/staging-five-remaining-verified-20261121" and .event == "push"
              and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml"
            ' "$RUNNER_TEMP/source-ci.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/223" > "$RUNNER_TEMP/staging-qa-pr.json"
            jq -e --arg sha "$SOURCE_SHA" '
              .head.sha == $sha and .base.ref == "perf/staging-api-bootstrap-exact-deployed-20261117"
              and .base.sha == "d7a7a62de0430e9e2c8ea870067f55ed7f0e96c1"
              and .state == "open" and .draft == true
            ' "$RUNNER_TEMP/staging-qa-pr.json" > /dev/null
            if [[ "$MODE" == "deploy" ]]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/qa/staging-five-remaining-verified-20261121" --jq '.object.sha')
              test "$current" = "$SOURCE_SHA" || { echo 'Staging QA PR branch SHA changed; stop'; exit 1; }
            fi
          elif [[ "$CANDIDATE" == "v5" ]]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-ci.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo
              and .head_branch == "experiment/staging-reply-v5-examples-20261122" and .event == "push"
              and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml"
            ' "$RUNNER_TEMP/source-ci.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/228" > "$RUNNER_TEMP/staging-v5-pr.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head.sha == $sha and .head.repo.full_name == $repo
              and .head.ref == "experiment/staging-reply-v5-examples-20261122"
              and .base.ref == "qa/staging-five-remaining-verified-20261121"
              and .base.sha == "829b8596251d004126d4bc1a244925201f0cd3a1"
              and .state == "open" and .draft == true and .changed_files == 9
            ' "$RUNNER_TEMP/staging-v5-pr.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/228/files?per_page=100" > "$RUNNER_TEMP/staging-v5-files.json"
            jq -e '
              ([.[].filename] | sort) == ([
                "api/src/ai.ts",
                "docs/experiments/reply-v5-human-examples-20261122.md",
                "prompts/prompt-v5-human.js",
                "prompts/reply-v5-examples.js",
                "prompts/reply-v5-quality.js",
                "prompts/staging-reply-prompt-selector.js",
                "tests/reply-v5-human.test.js",
                "tests/reply-v5-quality.test.js",
                "tests/staging-reply-prompt-selector.test.js"
              ] | sort)
            ' "$RUNNER_TEMP/staging-v5-files.json" > /dev/null
            if [[ "$MODE" == "deploy" ]]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/staging-reply-v5-examples-20261122" --jq '.object.sha')
              test "$current" = "$SOURCE_SHA" || { echo 'Staging V5 PR branch SHA changed; stop'; exit 1; }
            fi
          elif [[ "$CANDIDATE" == "v5.1" ]]; then
            test "$SOURCE_SHA" = "14a11ce423b07aa78a34aee2d93b6eac32377e6f"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-ci.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo
              and .head_branch == "experiment/staging-v5-friendly-tone-20261122" and .event == "push"
              and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml"
            ' "$RUNNER_TEMP/source-ci.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/230" > "$RUNNER_TEMP/staging-v51-pr.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head.sha == $sha and .head.repo.full_name == $repo
              and .head.ref == "experiment/staging-v5-friendly-tone-20261122"
              and .base.ref == "experiment/staging-reply-v5-examples-20261122"
              and .base.sha == "7228639b163a7a1cffba4f5bb7373185cdb232ea"
              and .state == "open" and .draft == true and .changed_files == 3
            ' "$RUNNER_TEMP/staging-v51-pr.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/230/files?per_page=100" > "$RUNNER_TEMP/staging-v51-files.json"
            jq -e '
              ([.[].filename] | sort) == ([
                "docs/experiments/reply-v5-human-examples-20261122.md",
                "prompts/prompt-v5-human.js",
                "tests/reply-v5-human.test.js"
              ] | sort) and all(.[]; .status == "modified")
            ' "$RUNNER_TEMP/staging-v51-files.json" > /dev/null
            if [[ "$MODE" == "deploy" ]]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/staging-v5-friendly-tone-20261122" --jq '.object.sha')
              test "$current" = "$SOURCE_SHA" || { echo 'Staging V5.1 PR branch SHA changed; stop'; exit 1; }
            fi
          elif [[ "$CANDIDATE" == "v5.2" ]]; then
            test "$SOURCE_SHA" = "d811d4b85d6c84f20c8afecf364d6f83fd558473"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/source-ci.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha == $sha and .head_repository.full_name == $repo
              and .head_branch == "experiment/staging-v52-retrieval-20261122" and .event == "push"
              and .status == "completed" and .conclusion == "success"
              and .path == ".github/workflows/ci.yml"
            ' "$RUNNER_TEMP/source-ci.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/232" > "$RUNNER_TEMP/staging-v52-pr.json"
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head.sha == $sha and .head.repo.full_name == $repo
              and .head.ref == "experiment/staging-v52-retrieval-20261122"
              and .base.ref == "experiment/staging-v5-friendly-tone-20261122"
              and .base.sha == "14a11ce423b07aa78a34aee2d93b6eac32377e6f"
              and .state == "open" and .draft == true and .changed_files == 4
            ' "$RUNNER_TEMP/staging-v52-pr.json" > /dev/null
            gh api "repos/$GITHUB_REPOSITORY/pulls/232/files?per_page=100" > "$RUNNER_TEMP/staging-v52-files.json"
            jq -e '
              ([.[].filename] | sort) == ([
                "docs/experiments/reply-v5-human-examples-20261122.md",
                "prompts/prompt-v5-human.js",
                "prompts/reply-v5-examples.js",
                "tests/reply-v5-human.test.js"
              ] | sort) and all(.[]; .status == "modified")
            ' "$RUNNER_TEMP/staging-v52-files.json" > /dev/null
            if [[ "$MODE" == "deploy" ]]; then
              current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/experiment/staging-v52-retrieval-20261122" --jq '.object.sha')
              test "$current" = "$SOURCE_SHA" || { echo 'Staging V5.2 PR branch SHA changed; stop'; exit 1; }
            fi
          else
            exit 1
          fi
      - name: Checkout exact CI-approved source, no persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Validate Staging-only configuration without remote D1 SQL
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import json
          cfg=json.load(open('api/wrangler.jsonc'))
          st=cfg['env']['staging']
          assert st['name']=='reply-copilot-api-staging'
          assert st['vars']['ENVIRONMENT']=='staging'
          assert st['vars']['API_ORIGIN']=='https://api-staging.x-reply-helper.top'
          assert st['vars']['WEB_ORIGIN']=='https://staging.x-reply-helper.top'
          assert st['vars']['PAYMENTS_ENABLED']=='1'
          assert st['d1_databases'][0]['binding']=='DB'
          assert st['d1_databases'][0]['database_id']=='cd44bb44-b525-42c4-b286-2cc84dae7fdb'
          assert cfg['env']['production']['d1_databases'][0]['database_id']!='cd44bb44-b525-42c4-b286-2cc84dae7fdb'
          assert 'EMAIL_LOGIN_ENABLED' not in st['vars']
          assert 'PASSWORD_FREE_TINY_CPU_ENABLED' not in st['vars']
          assert 'STAGING_QA_SUBSCRIPTION_FIVE' not in st['vars']
          assert 'STAGING_QA_SUBSCRIPTION_USER_ID' not in st['vars']
          assert 'STAGING_QA_SUBSCRIPTION_USERNAME' not in st['vars']
          print('PASS Staging-only config and default-off password mode')
          PY
      - name: Check exact currently deployed Staging version and D1 binding
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-staging/deployments" \
            > "$RUNNER_TEMP/live.json"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-staging/settings" \
            > "$RUNNER_TEMP/bindings.json"
          python3 - <<'PY'
          import json,os
          base=os.environ['RUNNER_TEMP']
          d=json.load(open(base+'/live.json'))
          s=json.load(open(base+'/bindings.json'))
          assert d['success'] and s['success']
          versions=d['result']['deployments'][0]['versions']
          assert len(versions)==1 and versions[0]['percentage']==100
          assert versions[0]['version_id']==os.environ['EXPECTED']
          if os.environ['MODE']=='deploy':
            assert d['result']['deployments'][0]['id']==os.environ['EXPECTED_DEPLOYMENT'], 'Staging deployment drift'
          bindings={b['name']:b for b in s['result']['bindings']}
          assert set(b['type'] for b in bindings.values()) <= {'plain_text','secret_text','d1'}
          assert bindings['DB']['type']=='d1' and bindings['DB']['id']=='cd44bb44-b525-42c4-b286-2cc84dae7fdb'
          assert 'PASSWORD_FREE_TINY_CPU_ENABLED' not in bindings
          assert 'EMAIL_LOGIN_ENABLED' not in bindings
          if os.environ.get('CANDIDATE') in ('v5','v5.1','v5.2'):
            assert 'STAGING_REPLY_PROMPT_VERSION' not in bindings, 'V5 requires absent prompt override; do not change settings'
          config=json.load(open('api/wrangler.jsonc'))['env']['staging']['vars']
          for k,v in config.items():
            assert bindings.get(k,{}).get('type')=='plain_text', 'Binding missing: '+k
            assert bindings[k].get('text')==v, 'Binding differs: '+k
          print('PASS current Staging version, 27+ secret bindings preserved and all configured vars match (values redacted)')
          PY
      - name: Mirror validated live Staging configuration into ephemeral strict-deploy config
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          workers="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$workers/domains?service=reply-copilot-api-staging" > "$RUNNER_TEMP/staging-domains-before.json"
          curl -fsS -H "$auth" "$workers/scripts/reply-copilot-api-staging/subdomain" > "$RUNNER_TEMP/staging-subdomain-before.json"
          python3 - <<'PARITY_PY'
          import json, os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])
          def result(name):
              data=json.loads((temp/name).read_text())
              assert data["success"], "Cloudflare preflight response failed"
              return data["result"]
          cfg=json.loads(Path("api/wrangler.jsonc").read_text())
          st=cfg["env"]["staging"]
          assert st["name"]=="reply-copilot-api-staging"
          assert cfg["compatibility_date"]=="2026-10-14"
          assert st["workers_dev"] is False
          assert st["vars"]["ENVIRONMENT"]=="staging"
          assert not st.get("routes") and not st.get("route")
          assert st["d1_databases"]==[{"binding":"DB","database_name":"reply-copilot-staging","database_id":"cd44bb44-b525-42c4-b286-2cc84dae7fdb","migrations_dir":"migrations"}]
          live=result("bindings.json")
          assert live["compatibility_date"]==cfg["compatibility_date"]
          assert not live.get("compatibility_flags")
          bindings=live["bindings"]
          assert len({b["name"] for b in bindings})==len(bindings)
          assert all(b["type"] in ("plain_text","secret_text","d1") for b in bindings)
          assert [(b["name"],b["id"]) for b in bindings if b["type"]=="d1"]==[("DB","cd44bb44-b525-42c4-b286-2cc84dae7fdb")]
          assert len([b for b in bindings if b["type"]=="secret_text"])>=27
          plain={b["name"]:b["text"] for b in bindings if b["type"]=="plain_text"}
          assert all(isinstance(v,str) for v in plain.values())
          assert all(plain.get(k)==v for k,v in st["vars"].items()), "Declared vars drifted"
          if os.environ.get("CANDIDATE") in ("v5","v5.1","v5.2"):
              assert "STAGING_REPLY_PROMPT_VERSION" not in plain and "STAGING_REPLY_PROMPT_VERSION" not in st["vars"], "V5 requires absent prompt override"
          # Only known Dashboard-managed non-secret keys may be mirrored.
          # QA flags may be preserved if present, never created here.
          allowed={
              "AI_PERFORMANCE_DIAGNOSTICS","BOLTUTIL_ADMIN_TEST_ENABLED",
              "BOLTUTIL_ADMIN_TEST_SCHEMA_READY","BOLTUTIL_BEP20_ENABLED",
              "BOLTUTIL_CNY_PER_USDT_MICROS","BOLTUTIL_ENABLED","BOLTUTIL_ERC20_ENABLED",
              "BOLTUTIL_POLYGON_ENABLED","BOLTUTIL_SCHEMA_READY","BOLTUTIL_SOLANA_ENABLED",
              "BOLTUTIL_STAGING_CREATE_ENABLED","BOLTUTIL_TRC20_ENABLED",
              "STAGING_QA_SUBSCRIPTION_FIVE","STAGING_QA_SUBSCRIPTION_USERNAME",
              "STAGING_QA_SUBSCRIPTION_USER_ID","STAGING_REPLY_PROMPT_VERSION",
              "SUBSCRIPTION_CHECKOUT_ENABLED","SUBSCRIPTION_PURCHASES_ENABLED",
              "SUBSCRIPTIONS_ENABLED","XIAODOU_RSA2_SUBSCRIPTIONS_READY",
              "XIAODOU_SOURCE_IP_CONFIRMED"
          }
          extra=set(plain)-set(st["vars"])
          assert extra<=allowed, "Unexpected live var names: "+", ".join(sorted(extra-allowed))
          assert "EMAIL_LOGIN_ENABLED" not in plain and "PASSWORD_FREE_TINY_CPU_ENABLED" not in plain
          domains=result("staging-domains-before.json")
          assert len(domains)==1, "Unexpected domain set"
          domain=domains[0]
          assert domain["hostname"]=="api-staging.x-reply-helper.top"
          assert domain["service"]=="reply-copilot-api-staging"
          assert domain["environment"]=="production" # Workers default service environment, not the app environment
          assert domain["zone_name"]=="x-reply-helper.top"
          assert domain["enabled"] is True and domain["previews_enabled"] is False
          subdomain=result("staging-subdomain-before.json")
          assert subdomain=={"enabled":False,"previews_enabled":False}, "Unexpected workers.dev or preview state"
          # Wrangler 4.151.0 strict comparison treats local D1 name/migration
          # metadata as drift from Dashboard bindings, which only contain name/id.
          # Source config was checked above; normalize ONLY the ephemeral deploy
          # config. No database lookup, migration, or change to binding identity.
          st["d1_databases"]=[{"binding":b["name"],"database_id":b["id"]} for b in bindings if b["type"]=="d1"]
          st["vars"]=plain
          st["preview_urls"]=False
          st["routes"]=[{"pattern":domain["hostname"],"zone_name":domain["zone_name"],"custom_domain":True,"enabled":True,"previews_enabled":False}]
          # Preserve source config and write only an ephemeral file next to it.
          # No secret values, API credentials or production config are copied
          # from the remote service, and the file is never uploaded as an artifact.
          Path("api/.wrangler-staging-strict.json").write_text(json.dumps(cfg,indent=2)+"\n")
          print("PASS: exact Staging route, disabled previews and existing allowlisted vars mirrored; secret names/D1 unchanged")
          PARITY_PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Build and typecheck exact Staging code; never deploy
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix api ci
          npm --prefix api run check:staging
          npm --prefix api run typecheck
          ./api/node_modules/.bin/wrangler deploy --config api/.wrangler-staging-strict.json --env staging \
            --dry-run --outdir "$RUNNER_TEMP/staging-worker-compiled" --keep-vars --strict
      - name: Optional inactive version upload, with active version rechecked twice
        if: inputs.mode == 'upload'
        shell: bash
        run: |
          set -euo pipefail
          live() {
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-staging/deployments" \
              | jq -er '.result.deployments[0].versions | if length==1 and .[0].percentage==100 then .[0].version_id else error("Unexpected traffic split") end'
          }
          test "$(live)" = "$EXPECTED"
          ./api/node_modules/.bin/wrangler versions upload --config api/.wrangler-staging-strict.json \
            --env staging --keep-vars --strict --message "Staging Reply QA candidate $SOURCE_SHA" \
            > "$RUNNER_TEMP/staging-upload.log" 2>&1 || {
              echo 'Cloudflare refused inactive upload; no traffic changed' >&2
              exit 1
            }
          test "$(live)" = "$EXPECTED"
          echo 'PASS: Inactive Staging Worker version uploaded; live traffic unchanged' >> "$GITHUB_STEP_SUMMARY"
      - name: Guard and deploy only the approved active Staging Worker
        if: inputs.mode == 'deploy'
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-staging"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          curl -fsS -H "$auth" "$base/deployments" > "$RUNNER_TEMP/staging-immediate.json"
          curl -fsS -H "$auth" "$base/settings" > "$RUNNER_TEMP/staging-settings-immediate.json"
          jq -e --arg version "$EXPECTED" --arg deployment "$EXPECTED_DEPLOYMENT" '
            .success and .result.deployments[0].id==$deployment
            and (.result.deployments[0].versions|length)==1
            and (.result.deployments[0].versions[0].version_id==$version)
            and (.result.deployments[0].versions[0].percentage==100)
          ' "$RUNNER_TEMP/staging-immediate.json" >/dev/null
          # Compare all variable values, secret NAMES, D1 IDs, runtime flags.
          # Never expose passwords or other variable values in logs.
          fingerprint() {
            jq -S '{plain:([.result.bindings[]|select(.type=="plain_text")|{name,text}]|sort_by(.name)),
              secrets:([.result.bindings[]|select(.type=="secret_text")|.name]|sort),
              d1:([.result.bindings[]|select(.type=="d1")|{name,id}]|sort_by(.name)),
              compatibility_date:.result.compatibility_date,
              compatibility_flags:(.result.compatibility_flags//[]|sort)}' "$1" > "$2"
          }
          fingerprint "$RUNNER_TEMP/bindings.json" "$RUNNER_TEMP/staging-bindings-before.fingerprint"
          fingerprint "$RUNNER_TEMP/staging-settings-immediate.json" "$RUNNER_TEMP/staging-bindings-immediate.fingerprint"
          cmp -s "$RUNNER_TEMP/staging-bindings-before.fingerprint" "$RUNNER_TEMP/staging-bindings-immediate.fingerprint" ||
            { echo 'Staging Worker settings changed since preflight; stop'; exit 1; }
          workers="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          routing_fingerprint() {
            jq -Se '.result | map({hostname,service,environment,zone_name,enabled,previews_enabled}) | sort_by(.hostname)' "$1"
          }
          curl -fsS -H "$auth" "$workers/domains?service=reply-copilot-api-staging" > "$RUNNER_TEMP/staging-domains-immediate.json"
          curl -fsS -H "$auth" "$base/subdomain" > "$RUNNER_TEMP/staging-subdomain-immediate.json"
          cmp -s <(routing_fingerprint "$RUNNER_TEMP/staging-domains-before.json") <(routing_fingerprint "$RUNNER_TEMP/staging-domains-immediate.json") || { echo 'Staging domain drift; stop'; exit 1; }
          cmp -s <(jq -Se .result "$RUNNER_TEMP/staging-subdomain-before.json") <(jq -Se .result "$RUNNER_TEMP/staging-subdomain-immediate.json") || { echo 'Staging preview drift; stop'; exit 1; }
          # Strict mode refuses unexpected Script-API ownership transfer.
          ./api/node_modules/.bin/wrangler deploy --config api/.wrangler-staging-strict.json --env staging --keep-vars --strict
          curl -fsS -H "$auth" "$base/deployments" > "$RUNNER_TEMP/staging-new.json"
          curl -fsS -H "$auth" "$base/settings" > "$RUNNER_TEMP/staging-new-settings.json"
          jq -e --arg version "$EXPECTED" --arg deployment "$EXPECTED_DEPLOYMENT" '
            .success and .result.deployments[0].id!=$deployment
            and (.result.deployments[0].versions|length)==1
            and (.result.deployments[0].versions[0].version_id!=$version)
            and (.result.deployments[0].versions[0].percentage==100)
          ' "$RUNNER_TEMP/staging-new.json" >/dev/null
          fingerprint "$RUNNER_TEMP/staging-new-settings.json" "$RUNNER_TEMP/staging-bindings-after.fingerprint"
          cmp -s "$RUNNER_TEMP/staging-bindings-before.fingerprint" "$RUNNER_TEMP/staging-bindings-after.fingerprint" ||
            { echo 'Staging Worker settings/secrets/D1 changed after deploy; STOP'; exit 1; }
          curl -fsS -H "$auth" "$workers/domains?service=reply-copilot-api-staging" > "$RUNNER_TEMP/staging-domains-after.json"
          curl -fsS -H "$auth" "$base/subdomain" > "$RUNNER_TEMP/staging-subdomain-after.json"
          cmp -s <(routing_fingerprint "$RUNNER_TEMP/staging-domains-before.json") <(routing_fingerprint "$RUNNER_TEMP/staging-domains-after.json") || { echo 'Staging domain changed after deploy; STOP'; exit 1; }
          cmp -s <(jq -Se .result "$RUNNER_TEMP/staging-subdomain-before.json") <(jq -Se .result "$RUNNER_TEMP/staging-subdomain-after.json") || { echo 'Staging preview changed after deploy; STOP'; exit 1; }
          curl -fsS --retry 4 --retry-all-errors --max-time 15 \
            https://api-staging.x-reply-helper.top/health | jq -e '.ok==true' >/dev/null
          code=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/staging-auth.json" -w '%{http_code}' \
            https://api-staging.x-reply-helper.top/v1/admin/dashboard)
          [[ "$code" == "401" || "$code" == "403" ]] ||
            { echo "Staging admin auth guard changed: HTTP $code"; exit 1; }
          echo 'PASS: New Worker at 100%; existing vars/secrets/D1 and admin auth preserved'
      - name: Delete ephemeral deployment config
        if: always()
        run: rm -f api/.wrangler-staging-strict.json
      - name: Final verified summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Staging Worker validation: $MODE"
            echo "- Release source: $SOURCE_SHA"
            echo "- Successful Staging QA source CI run: $CI_RUN_ID"
            if [[ "$MODE" == "deploy" ]]; then
              echo "- Previous Staging version: $EXPECTED; strict deploy and postflight succeeded"
            else
              echo "- Active Staging version preserved: $EXPECTED"
            fi
            echo "- No Production deployment, no remote D1 SQL, no Staging QA account override activated"
          } >> "$GITHUB_STEP_SUMMARY"
