name: CF Free stored telemetry recovery tests
on:
  push:
    branches: ['chatgpt/cf-free-v6-telemetry-recovery-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test api/tests/cf-free-cloud-telemetry.test.mjs
