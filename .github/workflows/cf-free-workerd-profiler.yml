name: CF Free local workerd CPU profiling
on:
  push:
    branches: ['chatgpt/cf-free-workerd-profiler-20261126']
permissions:
  contents: read
jobs:
  profile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix api ci
      - run: node --test api/tests/cf-free-workerd-profiler.test.mjs
      - run: node api/scripts/cf-free-workerd-profiler/run.mjs "$RUNNER_TEMP/profile.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-workerd-profile
          path: ${{ runner.temp }}/profile.json
