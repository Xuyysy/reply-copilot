name: One-time guarded Staging USDT cross-rail subscription original-order recovery
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: reply-copilot-staging-boltutil-admin-probe
  cancel-in-progress: false
jobs:
  build:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 146 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/deploy-staging-usdt-order-recovery b5579d3317001a228ec456383d3043522129fabf'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 'b5579d3317001a228ec456383d3043522129fabf'
      CI_RUN_ID: '43787072034'
    steps:
      - name: Verify exact successful Push CI, PR head and tightly scoped source
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/146 --jq '.head.sha')" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_repository.full_name==$repo and .event=="push" and .status=="completed" and .conclusion=="success" and .path==".github/workflows/ci.yml"' "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/5806f8e06562fbe0a215b90f57dddd351d5589a1...$SOURCE_SHA" > "$RUNNER_TEMP/diff.json"
          jq -e '.status=="ahead" and .behind_by==0 and ([.files[].filename]|sort)==["api/tests/boltutil-integration.test.mjs","web/src/pages/usdt-checkout.astro","web/tests/boltutil-ui-visibility.test.mjs"]' "$RUNNER_TEMP/diff.json"
      - uses: actions/checkout@v4
        with:
          ref: 'b5579d3317001a228ec456383d3043522129fabf'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build exact-source Staging Pages
        run: |
          set -euo pipefail
          npm --prefix web ci
          npm --prefix web run build:staging
      - name: Validate new cross-rail recovery and five-chain checkout artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          html=Path('web/dist/usdt-checkout/index.html').read_text()
          assert all(marker in html for marker in [
            'id="bolt-subscription-blocker"','id="bolt-blocker-list"',
            'id="bolt-recent-orders"','id="bolt-qr"','id="bolt-fee-guidance"',
            'value="TRC20"','value="POLYGON"','value="BEP20"',
            'value="ERC20"','value="SOLANA"'])
          js='\n'.join(p.read_text(errors='replace') for p in Path('web/dist').rglob('*.js'))
          for marker in ['SUBSCRIPTION_PENDING_ORDER','SUBSCRIPTION_RENEWAL_QUEUED',
                         '/v1/subscriptions/orders','/v1/boltutil/orders',
                         'subscriptionConflict','showSubscriptionBlockers']:
              assert marker in js, 'Missing blocked subscription recovery marker '+marker
          assert 'https://api-staging.x-reply-helper.top' in js
          print('PASS original fiat subscription and USDT order recovery compiled')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staging-usdt-order-recovery-b5579d3317001a228ec456383d3043522129fabf
          path: web/dist
          retention-days: 3
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: staging
      url: https://staging.x-reply-helper.top/usdt-checkout/
    env:
      SOURCE_SHA: 'b5579d3317001a228ec456383d3043522129fabf'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: staging-usdt-order-recovery-b5579d3317001a228ec456383d3043522129fabf
          path: web/dist
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Pages publishing tool
        run: npm install --prefix "$RUNNER_TEMP/staging-wrangler" --no-save --no-audit --no-fund wrangler@4.151.0
      - name: Verify pinned Staging/Production deployments and 60 immutable worker bindings
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import os,json,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token}),timeout=30) as f:r=json.load(f)
              assert r.get('success'),path
              return r['result']
          s=get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]
          assert s['id']=='16d6d2ca-06d6-4b4d-b8b8-e5226fe74366'
          assert len(s['versions'])==1 and s['versions'][0]['version_id']=='63a0ce2e-d18f-4bc6-8c00-aadcfee67a64' and s['versions'][0]['percentage']==100
          assert get('/pages/projects/x-reply-helper-staging')['canonical_deployment']['id']=='05316785-3b9b-497a-84d4-66d2a3aedee3'
          assert get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]['id']=='86cf104d-33a3-46b8-b165-7e1aaef58dce'
          assert get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='238b6dcb-bcf9-4077-bd93-9888c0d76c09'
          b=get('/workers/scripts/reply-copilot-api-staging/settings')['bindings']
          assert len(b)==60 and next(x for x in b if x['name']=='DB')['id']=='cd44bb44-b525-42c4-b286-2cc84dae7fdb'
          flags={x['name']:x.get('text') for x in b if x['type']=='plain_text'}
          assert flags.get('ENVIRONMENT')=='staging' and flags.get('BOLTUTIL_SCHEMA_READY')=='1' and flags.get('BOLTUTIL_STAGING_CREATE_ENABLED')=='1'
          assert flags.get('BOLTUTIL_CNY_PER_USDT_MICROS')=='7000000'
          assert all(flags.get('BOLTUTIL_'+n+'_ENABLED')=='1' for n in ['TRC20','POLYGON','BEP20','ERC20','SOLANA'])
          print('PASS exact Staging and Production pins, all five current networks, untouched Worker bindings')
          PY
      - name: Deploy ONLY Staging Pages, no Worker or DB change
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/staging-wrangler/node_modules/.bin/wrangler" pages deploy web/dist --project-name x-reply-helper-staging --branch codex/v0.4-credits --commit-hash "$SOURCE_SHA" --commit-message "Cross-rail subscription original-order recovery $SOURCE_SHA"
      - name: Verify exact released Pages and Production isolation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token}),timeout=30) as f:r=json.load(f)
              assert r.get('success'),path
              return r['result']
          pages=get('/pages/projects/x-reply-helper-staging')['canonical_deployment']
          assert pages['latest_stage']['status']=='success' and pages['deployment_trigger']['metadata']['commit_hash']==os.environ['SOURCE_SHA']
          stage=get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]
          assert stage['id']=='16d6d2ca-06d6-4b4d-b8b8-e5226fe74366' and stage['versions'][0]['version_id']=='63a0ce2e-d18f-4bc6-8c00-aadcfee67a64'
          assert get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]['id']=='86cf104d-33a3-46b8-b165-7e1aaef58dce'
          assert get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='238b6dcb-bcf9-4077-bd93-9888c0d76c09'
          print('PASS Staging Pages original-order recovery and unchanged Worker/Production')
          PY
      - name: Restore previous Staging Pages if our release incomplete
        if: failure()
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN')
          account=os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          if not token or not account:raise SystemExit(0)
          root='https://api.cloudflare.com/client/v4/accounts/'+account
          headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          try:
              def call(method,path):
                  req=urllib.request.Request(root+path,method=method,headers=headers)
                  with urllib.request.urlopen(req,timeout=30) as f:data=json.load(f)
                  assert data.get('success'),data.get('errors')
                  return data['result']
              pages=call('GET','/pages/projects/x-reply-helper-staging')['canonical_deployment']
              if pages['deployment_trigger']['metadata']['commit_hash']==os.environ['SOURCE_SHA']:
                  call('POST','/pages/projects/x-reply-helper-staging/deployments/05316785-3b9b-497a-84d4-66d2a3aedee3/rollback')
                  print('Restored pinned previous Staging Pages')
          except Exception as e:raise SystemExit('STAGING PAGES ROLLBACK REQUIRES OPERATOR: '+str(e))
          PY
