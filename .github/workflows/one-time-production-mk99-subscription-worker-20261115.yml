name: Owner-approved Production MK99 closed-subscription reconciliation Worker API version (one-time)

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read

concurrency:
  group: reply-copilot-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify user-approved exact source, CI, build and file scope
    if: >-
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 142 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/deploy-production-mk99-subscription-worker 8f9a4b7d2e99d28e157c33080a040f606954bb52'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: '8f9a4b7d2e99d28e157c33080a040f606954bb52'
      CI_RUN_ID: '43695172152'
      BUILD_RUN_ID: '43695172181'
      BASE_SHA: '64f1769426c39649da0328be46a8101aa46272eb'
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Confirm immutable CI and production build
        shell: bash
        run: |
          set -euo pipefail
          test "$CI_RUN_ID" != "$BUILD_RUN_ID"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/production" --jq '.object.sha')" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/build.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_repository.full_name==$repo and .head_branch=="release/production" and .event=="push" and .status=="completed" and .conclusion=="success" and .path==".github/workflows/ci.yml"' "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_repository.full_name==$repo and .head_branch=="release/production" and .event=="push" and .status=="completed" and .conclusion=="success" and .path==".github/workflows/production-build.yml"' "$RUNNER_TEMP/build.json"
      - name: Verify exactly three MK99 subscription-fix source files
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/compare/$BASE_SHA...$SOURCE_SHA" > "$RUNNER_TEMP/compare.json"
          jq -e '.status=="ahead" and .behind_by==0 and ([.files[].filename]|sort)==
            ["api/src/subscription-checkout.ts","api/src/subscription-settlement.ts","api/tests/subscription-settlement.test.mjs"]' "$RUNNER_TEMP/compare.json"

  release:
    name: Upload API-managed Worker Version with strict inherited 42 bindings
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
      url: https://app.x-reply-helper.top
    env:
      SOURCE_SHA: '8f9a4b7d2e99d28e157c33080a040f606954bb52'
      CI_RUN_ID: '43695172152'
      BUILD_RUN_ID: '43695172181'
      RELEASE_MODE: deploy
      TARGET: worker
      EXPECTED_CURRENT: '59a89607-d59f-42a0-93ef-dc1530937144'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require existing Production credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Checkout trusted main release gate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Obtain immutable exact Production build
        uses: actions/download-artifact@v4
        with:
          name: production-build-8f9a4b7d2e99d28e157c33080a040f606954bb52
          run-id: 43695172181
          github-token: ${{ github.token }}
          path: release
      - name: Validate Production provenance and MK99-plus-Xiaodou/V3 safeguards
        run: |
          set -euo pipefail
          python3 scripts/verify-production-artifact.py release "$SOURCE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('release/worker/index.js')
          content=p.read_text()
          for marker in ['subscription-list-reconcile:', 'reconcileUnpaidXiaodouTerminal', 'cancelUnpaidXiaodouSubscriptionCheckout', 'SUBSCRIPTION_CLOSE_UNCONFIRMED', 'reconcileUnpaidMk99Closed', 'holdLateMk99Payment', 'Write an X comment, not a response essay']:
              if marker not in content:
                  raise RuntimeError('Unverified Worker code marker: '+marker)
          assert p.stat().st_size>300000
          print('PASS: MK99 auto close + late paid review, Xiaodou cancel, Production V3 preserved')
          PY
      - name: Pin previous live Worker and all Producer bindings before modification
        run: python3 scripts/guard-production-release.py before
      - name: Check unmodified Pages, Staging and latest API-managed Worker Version, prepare strict inheritance
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          account=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          root='https://api.cloudflare.com/client/v4/accounts/'+account
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token}),timeout=30) as q: r=json.load(q)
              if not r.get('success'):raise RuntimeError('Cloudflare read-only preflight failed')
              return r['result']
          deployed=get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]
          assert deployed['id']=='6e97fce6-c91a-42df-abb7-4d907ce5045e'
          assert len(deployed['versions'])==1 and deployed['versions'][0]['version_id']=='59a89607-d59f-42a0-93ef-dc1530937144'
          assert deployed['versions'][0]['percentage']==100
          latest=get('/workers/scripts/reply-copilot-api-production/versions')['items'][0]
          assert latest['id']=='59a89607-d59f-42a0-93ef-dc1530937144','Latest uploaded Worker version differs from current traffic'
          current=get('/workers/scripts/reply-copilot-api-production/settings')
          bindings=current.get('bindings',[])
          from collections import Counter
          assert Counter(b['type'] for b in bindings)=={'plain_text':27,'secret_text':14,'d1':1}
          assert len(bindings)==42 and len(set(b['name'] for b in bindings))==42
          assert current['compatibility_date']=='2026-10-14'
          assert current.get('compatibility_flags',[])==[]
          assert (get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='f26991b4-c93e-4301-87e3-dc64ab312c19')
          assert get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]['id']=='8ff3df45-0c70-4ce1-a036-541e9a0e7eaa'
          assert get('/pages/projects/x-reply-helper-staging')['canonical_deployment']['id']=='593b0e78-3573-4f9a-b8f0-f857708450d0'
          meta={'main_module':'index.js','compatibility_date':'2026-10-14','compatibility_flags':[],
                'usage_model':'standard',
                'bindings':[{'type':'inherit','name':b['name']} for b in bindings],
                'annotations':{
                    'workers/commit_sha':os.environ['SOURCE_SHA'],
                    'workers/pull_request_number':'142',
                    'workers/pull_request_url':'https://github.com/Xuyysy/reply-copilot/pull/142',
                    'workers/repository_url':'https://github.com/Xuyysy/reply-copilot',
                    'workers/message':'Approved Production MK99 signed TRADE_CLOSED and late-paid audit sync. Xiaodou unchanged. Preserve 42 inherited bindings and existing live V3 tone. Rollback 59a89607-d59f-42a0-93ef-dc1530937144.'}}
          pathlib.Path(os.environ['RUNNER_TEMP'],'worker-upload-meta.json').write_text(json.dumps(meta))
          pathlib.Path(os.environ['RUNNER_TEMP'],'binding-names.json').write_text(json.dumps(sorted(b['name'] for b in bindings)))
          print('PASS: 42 inherited binding names; active/latest source and Pages/Staging pins unchanged')
          PY
      - name: Upload precompiled Worker as API-managed version, NOT Wrangler source takeover
        shell: bash
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-production"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -F "metadata=@$RUNNER_TEMP/worker-upload-meta.json;type=application/json" \
            -F "index.js=@release/worker/index.js;type=application/javascript+module" \
            "$root/versions?bindings_inherit=strict" > "$RUNNER_TEMP/worker-version-created.json"
          python3 - <<'PY'
          import json,os,pathlib,re
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'worker-version-created.json').read_text())
          assert r.get('success') is True, 'Version upload failed'
          version=r.get('result',{}).get('id','')
          assert re.fullmatch(r'[0-9a-f-]{36}',version)
          pathlib.Path(os.environ['RUNNER_TEMP'],'new-worker-version').write_text(version)
          with open(os.environ['GITHUB_ENV'],'a') as o:o.write('NEW_VERSION_ID='+version+'\n')
          print('PASS: new Worker API version uploaded; no live traffic moved')
          PY
      - name: Strictly verify uploaded version has all 42 original bindings before traffic switch
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/reply-copilot-api-production'
          token=os.environ['CLOUDFLARE_API_TOKEN'];version=os.environ['NEW_VERSION_ID']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token}),timeout=30) as q:r=json.load(q)
              assert r.get('success') is True
              return r['result']
          new=get('/versions/'+version)
          expected=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'binding-names.json').read_text())
          names=sorted(b['name'] for b in new['resources']['bindings'])
          assert names==expected and len(names)==42,'Uploaded version lost or introduced bindings'
          current=get('/deployments')['deployments'][0]
          assert current['id']=='6e97fce6-c91a-42df-abb7-4d907ce5045e','Production traffic changed while preparing version'
          assert current['versions'][0]['version_id']=='59a89607-d59f-42a0-93ef-dc1530937144'
          print('PASS: new API version has exactly the 42 pinned binding names; active Worker unchanged')
          PY
      - name: Deploy approved new Worker API version at 100 percent
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          body={'strategy':'percentage','versions':[{'version_id':os.environ['NEW_VERSION_ID'],'percentage':100}],
                'annotations':{'workers/message':'Production MK99 signed-CLOSED read-repair fix #142, 42 bindings inherited; previous 59a89607-d59f-42a0-93ef-dc1530937144'}}
          pathlib.Path(os.environ['RUNNER_TEMP'],'worker-deploy-body.json').write_text(json.dumps(body))
          PY
          root="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-production"
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" --data-binary "@$RUNNER_TEMP/worker-deploy-body.json" \
            "$root/deployments" > "$RUNNER_TEMP/worker-deployment-created.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'worker-deployment-created.json').read_text())
          assert r.get('success') is True and r.get('result',{}).get('id')
          print('PASS: Production Worker deployment accepted, validating live state next')
          PY
      - name: Verify deployed Worker changed and EVERY setting/secret/D1 binding is unchanged
        run: python3 scripts/guard-production-release.py after
      - name: Verify production Pages and both Staging deployments remain unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(root+path,headers={'Authorization':'Bearer '+token}),timeout=30) as q:r=json.load(q)
              assert r.get('success') is True
              return r['result']
          deployed=get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]
          assert len(deployed['versions'])==1 and deployed['versions'][0]['version_id']==os.environ['NEW_VERSION_ID'] and deployed['versions'][0]['percentage']==100
          assert get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='f26991b4-c93e-4301-87e3-dc64ab312c19'
          assert get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]['id']=='8ff3df45-0c70-4ce1-a036-541e9a0e7eaa'
          assert get('/pages/projects/x-reply-helper-staging')['canonical_deployment']['id']=='593b0e78-3573-4f9a-b8f0-f857708450d0'
          print('PASS: Worker-only Production; Pages and Staging unchanged')
          PY
      - name: Restore original Production Worker version if any post-upload check fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f "$RUNNER_TEMP/new-worker-version"; then exit 0; fi
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          root='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/reply-copilot-api-production/deployments'
          headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Content-Type':'application/json'}
          def call(method,data=None):
              req=urllib.request.Request(root,data=json.dumps(data).encode() if data else None,headers=headers,method=method)
              with urllib.request.urlopen(req,timeout=30) as q:r=json.load(q)
              assert r.get('success') is True
              return r['result']
          current=call('GET')['deployments'][0]
          version=pathlib.Path(os.environ['RUNNER_TEMP'],'new-worker-version').read_text()
          if current['versions'][0]['version_id']!=version:
              print('No new Production Worker traffic to roll back')
          else:
              result=call('POST',{'strategy':'percentage','versions':[{'version_id':'59a89607-d59f-42a0-93ef-dc1530937144','percentage':100}],
                'annotations':{'workers/message':'Automatic rollback of failed MK99 subscription release, preserve Xiaodou/V3 Worker'}})
              assert result.get('id')
              print('ROLLBACK: previous Production Worker version restored at 100%')
          PY
      - name: Record successful one-time Worker-only release
        if: success()
        run: |
          echo '### Production Worker-only API version release success' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- New Worker version: $NEW_VERSION_ID" >> "$GITHUB_STEP_SUMMARY"
          echo '- Strict inherited binding count: 42; D1 SQL, Pages, Staging, merchant settings unchanged' >> "$GITHUB_STEP_SUMMARY"
