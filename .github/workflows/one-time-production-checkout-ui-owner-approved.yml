name: One-time owner-approved Production checkout UI Pages only

on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read

concurrency:
  group: reply-copilot-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release request and independent successful builds
    if: >-
      github.event_name == 'issue_comment' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.event.issue.number == 98 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.comment.body == '/deploy-production-checkout-ui 8200608265c1f71e08a55d4d05b7d73debe76f53'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: ${{ '8200608265c1f71e08a55d4d05b7d73debe76f53' }}
      RELEASE_MODE: ${{ 'deploy' }}
      CI_RUN_ID: ${{ '42992596322' }}
      BUILD_RUN_ID: ${{ '42992596087' }}
      TARGET: ${{ 'pages' }}
      EXPECTED_CURRENT: ${{ '0e3b317d-05cf-4747-ab7f-ee04ce615a68' }}
      CONFIRMATION: ${{ 'DEPLOY_PAGES_TO_PRODUCTION' }}
      API_ORIGIN_TAKEOVER: ${{ 'deny' }}
      API_ORIGIN_TAKEOVER_CONFIRMATION: ${{ '' }}
      EXPECTED_DEPLOYMENT: ${{ '' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Exact immutable release identity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ && "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          [[ "$EXPECTED_CURRENT" =~ ^[0-9a-f-]{36}$ ]] || exit 1
          test "$CI_RUN_ID" != "$BUILD_RUN_ID"
          case "$RELEASE_MODE:$TARGET:$CONFIRMATION" in
            check:worker:CHECK_ONLY|check:pages:CHECK_ONLY|deploy:worker:DEPLOY_WORKER_TO_PRODUCTION|deploy:pages:DEPLOY_PAGES_TO_PRODUCTION) ;;
            *) echo 'Release mode, target or confirmation phrase invalid'; exit 1 ;;
          esac
          # Explicitly opt in to the API-origin -> Wrangler ownership handoff.
          # Default behavior continues to fail closed with Wrangler --strict.
          case "$API_ORIGIN_TAKEOVER" in
            deny)
              test -z "$API_ORIGIN_TAKEOVER_CONFIRMATION" || { echo 'Unexpected source-takeover confirmation'; exit 1; }
              test -z "$EXPECTED_DEPLOYMENT" || { echo 'Unexpected takeover deployment pin'; exit 1; }
              ;;
            approve-after-review)
              test "$RELEASE_MODE:$TARGET" = "deploy:worker" || { echo 'API-origin approval only supported for Worker deployment'; exit 1; }
              test "$API_ORIGIN_TAKEOVER_CONFIRMATION" = "ACKNOWLEDGE_WORKER_SCRIPT_API_SOURCE_OVERWRITE" || { echo 'Missing separate API-origin overwrite approval'; exit 1; }
              [[ "$EXPECTED_DEPLOYMENT" =~ ^[0-9a-f-]{36}$ ]] || { echo 'Missing pinned current Worker deployment ID'; exit 1; }
              ;;
            *) echo 'Invalid API-origin takeover mode'; exit 1 ;;
          esac
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/production-ci-run.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > "$RUNNER_TEMP/production-build-run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_repository.full_name == $repo
            and .head_branch == "release/production" and .event == "push"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/ci.yml"
          ' "$RUNNER_TEMP/production-ci-run.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_repository.full_name == $repo
            and .head_branch == "release/production" and .event == "push"
            and .status == "completed" and .conclusion == "success"
            and .path == ".github/workflows/production-build.yml"
          ' "$RUNNER_TEMP/production-build-run.json"

  release:
    name: Manual guarded Production ${{ 'pages' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
      url: https://app.x-reply-helper.top
    env:
      SOURCE_SHA: ${{ '8200608265c1f71e08a55d4d05b7d73debe76f53' }}
      RELEASE_MODE: ${{ 'deploy' }}
      TARGET: ${{ 'pages' }}
      EXPECTED_CURRENT: ${{ '0e3b317d-05cf-4747-ab7f-ee04ce615a68' }}
      EXPECTED_DEPLOYMENT: ${{ '' }}
      API_ORIGIN_TAKEOVER: ${{ 'deny' }}
      API_ORIGIN_TAKEOVER_CONFIRMATION: ${{ '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require Production environment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Production environment credentials missing'; exit 1; }
      - name: Checkout exact trusted main workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify production API-origin guard in isolated offline tests
        shell: bash
        run: python3 -m unittest discover -s tests -p 'test_production_api_origin_guard.py' -v
      - name: Verify release branch SHA and only two reviewed checkout UI files changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: '8200608265c1f71e08a55d4d05b7d73debe76f53'
          OLD_SHA: '0d4660dcdf5a99d3dc6e74807ff1ee687a1e4798'
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/production" | jq -e --arg sha "$SOURCE_SHA" '.object.sha == $sha'
          gh api "repos/$GITHUB_REPOSITORY/pulls/98" | jq -e --arg sha "$SOURCE_SHA" '.merged == true and .merge_commit_sha == $sha'
          gh api "repos/$GITHUB_REPOSITORY/compare/$OLD_SHA...$SOURCE_SHA" > "$RUNNER_TEMP/checkout-pages-diff.json"
          jq -r '.files[].filename' "$RUNNER_TEMP/checkout-pages-diff.json" | sort > "$RUNNER_TEMP/checkout-pages-changed.txt"
          printf '%s\n' web/src/pages/checkout.astro web/tests/checkout-resume-browser.test.mjs | sort > "$RUNNER_TEMP/checkout-pages-allowlist.txt"
          diff -u "$RUNNER_TEMP/checkout-pages-allowlist.txt" "$RUNNER_TEMP/checkout-pages-changed.txt"
          echo 'PASS: only the two reviewed checkout UI files have changed'
      - name: Download immutable artifact from independently verified build
        uses: actions/download-artifact@v4
        with:
          name: production-build-${{ '8200608265c1f71e08a55d4d05b7d73debe76f53' }}
          run-id: ${{ '42992596087' }}
          github-token: ${{ github.token }}
          path: release
      - name: Validate pinned artifacts and safe Production target
        run: python3 scripts/verify-production-artifact.py release "$SOURCE_SHA"
      - name: Pin Production Worker and Staging Pages before Pages deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          expected=[
            ('workers/scripts/reply-copilot-api-production/deployments','c01fea89-3e1d-4b73-8e02-d2324714aea1'),
            ('pages/projects/x-reply-helper-staging/deployments','5429f04d-a3e7-42ce-a113-93376663f070')
          ]
          for path,want in expected:
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{acct}/{path}',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  data=json.load(resp)
              obj=data.get('result')
              rows=obj.get('deployments') if isinstance(obj,dict) else obj
              if not data.get('success') or not isinstance(rows,list) or not rows or rows[0].get('id')!=want:
                  raise SystemExit('FAIL CLOSED: unrelated Worker or Staging deployment changed')
          print('PASS: Production Worker and Staging Pages are unchanged')
          PY
      - name: Verify CURRENT live Worker and Pages state before deployment
        run: python3 scripts/guard-production-release.py before
      # The trusted historical main branch has NO api/package.json or api lockfile.
      # Staging already uses an isolated pinned Wrangler install for this reason.
      - uses: actions/setup-node@v4
        if: ${{ 'deploy' == 'deploy' }}
        with:
          node-version: '24'
      - name: Install pinned isolated Wrangler (no main-branch API dependency)
        if: ${{ 'deploy' == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/production-deploy-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.0
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" --version
      - name: Deploy ONLY precompiled verified Worker, with vars and Secrets preserved
        if: ${{ 'deploy' == 'deploy' && 'pages' == 'worker' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(pathlib.Path('release/worker-config.json').read_text())
          # Only the precompiled and SHA-verified Worker may be executed.
          config['main'] = str(pathlib.Path('release/worker/index.js').resolve())
          # Local developer file paths are not part of the remote Worker settings.
          config.pop('$schema', None)
          for db in config.get('d1_databases', []):
              db.pop('migrations_dir', None)
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'production.wrangler.json'
          path.write_text(json.dumps(config))
          PY
          if [[ "$API_ORIGIN_TAKEOVER" == "approve-after-review" ]]; then
            # The pre-upload --strict refusal is expected when the active
            # Worker was updated through the Script API. Require a second
            # separately approved owner confirmation and an exact deployment
            # pin before any intentional ownership transfer.
            test "$API_ORIGIN_TAKEOVER_CONFIRMATION" = "ACKNOWLEDGE_WORKER_SCRIPT_API_SOURCE_OVERWRITE"
            python3 scripts/guard-production-release.py before
            "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" deploy \
              --config "$RUNNER_TEMP/production.wrangler.json" \
              --no-bundle --keep-vars
          else
            "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" deploy \
              --config "$RUNNER_TEMP/production.wrangler.json" \
              --no-bundle --keep-vars --strict
          fi
      - name: Deploy ONLY immutable verified Production Pages files
        if: ${{ 'deploy' == 'deploy' && 'pages' == 'pages' }}
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/production-deploy-tools/node_modules/.bin/wrangler" pages deploy release/pages \
            --project-name x-reply-helper-production --branch main \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "Approved Production Pages $SOURCE_SHA"
      - name: Check deployment succeeded AND preserved payment/secret/D1 bindings
        if: ${{ 'deploy' == 'deploy' }}
        run: python3 scripts/guard-production-release.py after
      - name: Verify Production Worker and Staging Pages unchanged after Pages deployment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          acct=os.environ['CLOUDFLARE_ACCOUNT_ID']
          token=os.environ['CLOUDFLARE_API_TOKEN']
          expected=[
            ('workers/scripts/reply-copilot-api-production/deployments','c01fea89-3e1d-4b73-8e02-d2324714aea1'),
            ('pages/projects/x-reply-helper-staging/deployments','5429f04d-a3e7-42ce-a113-93376663f070')
          ]
          for path,want in expected:
              req=urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{acct}/{path}',headers={'Authorization':'Bearer '+token})
              with urllib.request.urlopen(req,timeout=25) as resp:
                  data=json.load(resp)
              obj=data.get('result')
              rows=obj.get('deployments') if isinstance(obj,dict) else obj
              if not data.get('success') or not isinstance(rows,list) or not rows or rows[0].get('id')!=want:
                  raise SystemExit('FAIL CLOSED: unrelated Worker or Staging deployment changed')
          print('PASS: Production Worker and Staging Pages are unchanged')
          PY
      - name: Preflight or release summary
        if: success()
        shell: bash
        run: |
          if [[ "$RELEASE_MODE" == 'check' ]]; then
            echo '### Production preflight passed (READ-ONLY; NOTHING DEPLOYED)' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Manually approved Production release completed' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "- Mode: $RELEASE_MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: $TARGET" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- Expected previous active ID: $EXPECTED_CURRENT" >> "$GITHUB_STEP_SUMMARY"
          echo '- D1 SQL/migrations, other component and Chrome Web Store: unchanged' >> "$GITHUB_STEP_SUMMARY"
