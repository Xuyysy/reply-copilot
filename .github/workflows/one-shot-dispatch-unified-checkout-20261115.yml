name: One-shot authorized PR136 Staging Pages dispatch
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  pull-requests: read
  actions: write
concurrency:
  group: one-shot-unified-checkout-pr136-dispatch-20261115
  cancel-in-progress: false
jobs:
  dispatch:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 136 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'APPROVE_STAGING_CHECKOUT_1C56C0BE_43687009380'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: 1c56c0bed0b2a5e4e3258cbbebb7f25691e419d6
      CI_RUN_ID: '43687009380'
    steps:
      - name: Confirm owner approval, unchanged PR, exact successful full Push CI
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/136" |
            jq -e --arg sha "$SOURCE_SHA" '.state=="open" and .draft==true and .head.sha==$sha'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" |
            jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '
              .head_sha==$sha and .head_repository.full_name==$repo and
              .status=="completed" and .conclusion=="success" and
              .event=="push" and .path==".github/workflows/ci.yml"'
      - name: Dispatch existing trusted main workflow with Pages-only flag
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-staging.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_sha="$SOURCE_SHA" \
            -f ci_run_id="$CI_RUN_ID" \
            -f deploy_worker=false \
            -f expected_worker_version=
          echo "Dispatched trusted main Staging Pages-only release for $SOURCE_SHA ($CI_RUN_ID)"
