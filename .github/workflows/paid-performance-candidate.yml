name: Paid performance candidate specialist
on:
  push:
    branches: ['chatgpt/paid-performance-release-candidate-20261126']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix api ci
      - run: npm --prefix api run typecheck
      - name: Verify protected source anchors unchanged
        run: git diff --exit-code 96a3adde9e81d74d49e54b18a354dc68bf766fa7 -- api/src/password-auth.ts api/src/admin-controls.ts api/src/admin-operations.ts api/src/mk99.ts api/migrations api/wrangler.jsonc api/package.json api/package-lock.json prompts .github/workflows/ci.yml
      - run: node --test api/tests/paid-performance-v55-local.test.mjs api/tests/cf-free-hot-path-contract.test.mjs api/tests/cf-free-zero-write-assertions.test.mjs api/tests/generation-hot-path.test.mjs api/tests/configured-ai-generation.test.mjs api/tests/extension-bootstrap-production.test.mjs api/tests/production-generation-workers-runtime.test.mjs api/tests/subscription-generation.test.mjs api/tests/mk99-payments.test.mjs api/tests/admin-auth-cpu-readiness.test.mjs tests/production-v55-no-corpus.test.mjs tests/crypto-hex.test.mjs
