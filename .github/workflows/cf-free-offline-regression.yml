name: CF Free diagnostics offline regression (no deployment)
on:
  push:
    branches:
      - 'ops/cf-free-http-status-cpu-*'
    paths:
      - 'scripts/cf-free-readiness.mjs'
      - 'scripts/cf-cpu-profile.mjs'
      - 'tests/cf-free-readiness.test.mjs'
      - 'tests/cf-cpu-profile.test.mjs'
      - '.github/workflows/cf-free-offline-regression.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/cf-free-readiness.mjs'
      - 'scripts/cf-cpu-profile.mjs'
      - 'tests/cf-free-readiness.test.mjs'
      - 'tests/cf-cpu-profile.test.mjs'
      - '.github/workflows/cf-free-offline-regression.yml'
permissions:
  contents: read
concurrency:
  group: cf-free-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: Offline CF Free diagnostics tests only
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test synthetic Cloudflare diagnostics (no network calls)
        run: node --test tests/cf-free-readiness.test.mjs tests/cf-cpu-profile.test.mjs
