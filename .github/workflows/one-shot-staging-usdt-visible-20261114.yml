name: One-shot approved Staging USDT visibility release
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  group: one-shot-boltutil-usdt-visibility-pr130-20261114
  cancel-in-progress: false
jobs:
  deploy-staging:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 130 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == 'APPROVE_STAGING_USDT_VISIBLE_D60C34B5_43594705642'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.x-reply-helper.top
    env:
      SOURCE_SHA: d60c34b5f22a65777e6076ffc5e9aa676d061460
      CI_RUN_ID: '43594705642'
      OLD_PAGES_ID: d5b35940-576c-42e4-b64c-a9a5c0dd2e0b
      STAGING_WORKER_VERSION: 1ecb0b33-0c8a-4f02-936e-50c31cec8267
      ACCOUNT_ID: cb5fc919a9f05dcf39b3ca29c9538a1f
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify exact approved full Push CI and source PR
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" |
            jq -e --arg s "$SOURCE_SHA" --arg r "$GITHUB_REPOSITORY" '
              .head_sha == $s and .head_repository.full_name == $r and
              .event == "push" and .status == "completed" and
              .conclusion == "success" and .path == ".github/workflows/ci.yml"
            '
          gh api "repos/$GITHUB_REPOSITORY/pulls/130" |
            jq -e --arg s "$SOURCE_SHA" '.draft == true and .state == "open" and .head.sha == $s'

      - name: Checkout trusted release tooling (main only)
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Download immutable Pages build from exact full CI
        uses: actions/download-artifact@v4
        with:
          name: staging-pages-${{ env.SOURCE_SHA }}
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: web/dist
      - name: Download exact provenance and sha256 manifest
        uses: actions/download-artifact@v4
        with:
          name: staging-extension-${{ env.SOURCE_SHA }}
          run-id: ${{ env.CI_RUN_ID }}
          github-token: ${{ github.token }}
          path: dist/ci
      - name: Verify source manifest and every file of Staging site
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          root=pathlib.Path.cwd()
          web=(root/'web/dist').resolve()
          m=json.loads((root/'dist/ci/release-manifest.json').read_text())
          for k,v in {'sourceSha':os.environ['SOURCE_SHA'],'channel':'staging',
                      'pagesProject':'x-reply-helper-staging',
                      'pagesDomain':'https://staging.x-reply-helper.top',
                      'stagingApi':'https://api-staging.x-reply-helper.top'}.items():
            if m.get(k)!=v:raise SystemExit('Invalid Pages manifest: '+k)
          expected={}
          for line in (root/'dist/ci/web-files.sha256').read_text().splitlines():
            mt=re.fullmatch(r'([0-9a-f]{64})  (web/dist/[A-Za-z0-9_./-]+)',line)
            if not mt: raise SystemExit('Bad file checksum line')
            sha,pth=mt.groups();p=(root/pth).resolve()
            if not p.is_relative_to(web) or not p.is_file() or p.is_symlink() or pth in expected:
              raise SystemExit('Unsafe/duplicate file')
            expected[pth]=sha
          actual={}
          for p in web.rglob('*'):
            if p.is_symlink():raise SystemExit('Symlinks forbidden')
            if p.is_file():actual[p.relative_to(root).as_posix()]=hashlib.sha256(p.read_bytes()).hexdigest()
          if expected!=actual or len(actual)<40 or len(actual)>100 or len(actual)!=m.get('webFileCount'):
            raise SystemExit('Staging Pages artifact SHA256 mismatch')
          for p in ('index.html','pricing/index.html','usdt-checkout/index.html','admin/index.html','account/index.html'):
            if not (web/p).is_file():raise SystemExit('Missing required page: '+p)
          pricing=(web/'pricing/index.html').read_text()
          if 'usdt-payment-method' not in pricing or 'TRON / Polygon / BNB' not in pricing:
            raise SystemExit('USDT visible pricing rail missing')
          scripts=' '.join(p.read_text(errors='replace') for p in web.rglob('*.js'))
          for marker in ('/v1/admin/boltutil/orders','USDT 收款','/v1/boltutil/availability'):
            if marker not in scripts:raise SystemExit('Admin USDT JS chunk missing: '+marker)
          if any(p.name in ('_worker.js','_routes.json') for p in web.rglob('*')):
            raise SystemExit('Unexpected dynamic Worker files')
          print('OK: verified',len(actual),'exact SHA256 static assets with visible USDT and Admin panel')
          PY
      - name: Install pinned isolated Wrangler
        uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: |
          npm install --prefix "$RUNNER_TEMP/staging-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.0
          "$RUNNER_TEMP/staging-tools/node_modules/.bin/wrangler" --version
      - name: Verify previous Pages + Worker not drifted
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test "$CLOUDFLARE_ACCOUNT_ID" = "$ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID"
          curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$root/pages/projects/x-reply-helper-staging/deployments?per_page=1" |
            jq -e --arg old "$OLD_PAGES_ID" '.success and .result[0].id == $old and .result[0].latest_stage.status == "success"'
          curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$root/workers/scripts/reply-copilot-api-staging/deployments?per_page=1" |
            jq -e --arg w "$STAGING_WORKER_VERSION" '.success and .result.deployments[0].versions == [{"version_id":$w,"percentage":100}]'
      - name: Deploy verified static files to Staging Pages ONLY
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/staging-tools/node_modules/.bin/wrangler" pages deploy web/dist \
            --project-name x-reply-helper-staging \
            --branch codex/v0.4-credits \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "Staging USDT rail and Admin V2 visibility fix"
      - name: Verify exact Pages deploy and original Worker unchanged
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          root="https://api.cloudflare.com/client/v4/accounts/$ACCOUNT_ID"
          curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$root/pages/projects/x-reply-helper-staging/deployments?per_page=1" |
            jq -e --arg s "$SOURCE_SHA" '.success and .result[0].latest_stage.status == "success" and .result[0].deployment_trigger.metadata.commit_hash == $s'
          curl -fsS --retry 2 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$root/workers/scripts/reply-copilot-api-staging/deployments?per_page=1" |
            jq -e --arg w "$STAGING_WORKER_VERSION" '.success and .result.deployments[0].versions == [{"version_id":$w,"percentage":100}]'
