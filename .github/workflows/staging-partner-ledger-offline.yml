name: Partner ledger release guard offline tests
on:
  push:
    branches: ['chatgpt/partner-ledger-staging-release-20261128']
  pull_request:
    paths:
      - '.github/workflows/staging-partner-ledger-20261128.yml'
      - '.github/workflows/staging-partner-ledger-offline.yml'
      - 'scripts/guarded-partner-ledger-staging-20261128.py'
      - 'tests/test_partner_ledger_staging_release.py'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m py_compile scripts/guarded-partner-ledger-staging-20261128.py tests/test_partner_ledger_staging_release.py
      - run: python3 -m unittest discover -s tests -p 'test_partner_ledger_staging_release.py' -v
