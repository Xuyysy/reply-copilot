name: One-time guarded Staging unlimited BoltUtil admin test attempts
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  pull-requests: read
  issues: read
concurrency:
  group: reply-copilot-staging-boltutil-admin-probe
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'Xuyysy' &&
      github.event.comment.user.login == 'Xuyysy' &&
      github.event.issue.number == 143 &&
      github.event.issue.pull_request != null &&
      github.event.comment.body == '/deploy-staging-unlimited-boltutil-tests 73d72fab2aecccc57d498858780fc3b1cb487c93'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: '73d72fab2aecccc57d498858780fc3b1cb487c93'
      CI_RUN_ID: '43708778245'
    steps:
      - name: Verify exact successful full Push CI, PR and source scope
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/pulls/143 --jq '.head.sha')" = "$SOURCE_SHA"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$SOURCE_SHA" --arg repo "$GITHUB_REPOSITORY" '.head_sha==$sha and .head_repository.full_name==$repo and .event=="push" and .status=="completed" and .conclusion=="success" and .path==".github/workflows/ci.yml"' "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/compare/35c161eeca4b79815e0a304faef1fd59d72e4a91...$SOURCE_SHA" > "$RUNNER_TEMP/compare.json"
          jq -e '.status=="ahead" and .behind_by==0 and ([.files[].filename]|sort)==["api/src/boltutil/admin-probes.ts","api/tests/boltutil-admin-diagnostics.test.mjs","api/tests/boltutil-admin-mainnet-probe.test.mjs","web/src/components/admin/AdminBoltUtilPanel.tsx"]' "$RUNNER_TEMP/compare.json"
      - name: Checkout exact Staging candidate without credentials
        uses: actions/checkout@v4
        with:
          ref: '73d72fab2aecccc57d498858780fc3b1cb487c93'
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            web/package-lock.json
      - name: Build Worker and Staging Pages, strictly no deployment
        run: |
          set -euo pipefail
          npm --prefix api ci
          npm --prefix web ci
          cd api
          ./node_modules/.bin/wrangler deploy --env staging --dry-run --outdir ../release-worker
          cd ..
          npm --prefix web run build:staging
      - name: Confirm private admin-only probe and staging-only Pages in compiled artifacts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          code=Path('release-worker/index.js').read_text()
          for marker in ['adminBoltTestCreate','adminBoltTestDiagnose','I_ACCEPT_REAL_1_USDT_MAINNET','operation_id','BOLTUTIL_ADMIN_TEST_ENABLED','BOLTUTIL_STAGING_CREATE_ENABLED','boltutil_admin_test_orders']:
              assert marker in code, 'Missing Worker marker '+marker
          assert 'credit_ledger' in code and 'boltutil_admin_test_orders' in code
          js='\n'.join(p.read_text(errors='replace') for p in Path('web/dist').rglob('*.js'))
          assert '测试次数不限' in js and 'I_ACCEPT_REAL_1_USDT_MAINNET' in js and '只读诊断：为何没有收银台' in js
          assert 'https://api-staging.x-reply-helper.top' in js
          assert Path('web/dist/admin/index.html').is_file()
          print('PASS Staging-only admin test Worker + Pages build')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: staging-boltutil-unlimited-tests-73d72fab2aecccc57d498858780fc3b1cb487c93
          path: |
            release-worker/index.js
            web/dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.x-reply-helper.top/admin/
    env:
      SOURCE_SHA: '73d72fab2aecccc57d498858780fc3b1cb487c93'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: staging-boltutil-unlimited-tests-73d72fab2aecccc57d498858780fc3b1cb487c93
          path: .
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Wrangler CLI separately from legacy main branch
        run: npm install --prefix "$RUNNER_TEMP/staging-wrangler" --no-save --no-audit --no-fund wrangler@4.151.0
      - name: Verify current Staging and Production pins and prepare strict inheritance
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          a=os.environ['CLOUDFLARE_ACCOUNT_ID'];token=os.environ['CLOUDFLARE_API_TOKEN']
          root='https://api.cloudflare.com/client/v4/accounts/'+a
          def get(p):
              with urllib.request.urlopen(urllib.request.Request(root+p,headers={'Authorization':'Bearer '+token}),timeout=30) as f:r=json.load(f)
              assert r.get('success'),p
              return r['result']
          worker=get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]
          assert worker['id']=='7c561b1d-7baa-46d9-8aac-e1d42fce4acf'
          assert len(worker['versions'])==1 and worker['versions'][0]['version_id']=='0fdc0e97-192b-425a-a0b1-6b26f66a41bd' and worker['versions'][0]['percentage']==100
          latest=get('/workers/scripts/reply-copilot-api-staging/versions')['items'][0]
          assert latest['id']=='1fccb56c-8513-4f6c-a66b-06d9e26f6a22'
          assert latest['annotations']['workers/commit_sha']==os.environ['SOURCE_SHA']
          s=get('/workers/scripts/reply-copilot-api-staging/settings')
          b=s['bindings'];assert len(b)==51 and s['compatibility_date']=='2026-10-14'
          names=[v['name'] for v in b]
          assert len(names)==len(set(names)) and 'DB' in names and 'BOLTUTIL_API_KEY' in names and 'BOLTUTIL_WEBHOOK_SECRET' in names
          assert sorted(n for n in names if n.startswith('BOLTUTIL_ADMIN_TEST_'))==['BOLTUTIL_ADMIN_TEST_ENABLED','BOLTUTIL_ADMIN_TEST_SCHEMA_READY']
          assert get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]['id']=='86cf104d-33a3-46b8-b165-7e1aaef58dce'
          assert get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='f26991b4-c93e-4301-87e3-dc64ab312c19'
          assert get('/pages/projects/x-reply-helper-staging')['canonical_deployment']['id']=='8ca5d401-ac18-473e-9952-0b1b151f05c6'
          dbid='cd44bb44-b525-42c4-b286-2cc84dae7fdb'
          assert next(x for x in b if x['name']=='DB')['id']==dbid
          q=urllib.request.Request(root+'/d1/database/'+dbid+'/query',method='POST',data=json.dumps({'sql':"SELECT name FROM sqlite_master WHERE name IN ('boltutil_admin_test_orders','boltutil_admin_test_events','boltutil_admin_test_recent','boltutil_admin_test_network_tx')"}).encode(),headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'})
          with urllib.request.urlopen(q,timeout=30) as f:r=json.load(f)
          assert r['success'] and len(r['result'][0]['results'])==4
          meta={'main_module':'index.js','compatibility_date':'2026-10-14','compatibility_flags':[],
                'usage_model':'standard',
                'bindings':[{'type':'inherit','name':n} for n in names],
                'annotations':{'workers/commit_sha':os.environ['SOURCE_SHA'],
                  'workers/message':'Sanitized provider create-error code recording; no auto payment and public checkout OFF'}}
          out=pathlib.Path(os.environ['RUNNER_TEMP'])
          (out/'staging-probe-metadata.json').write_text(json.dumps(meta))
          (out/'staging-probe-old-names.json').write_text(json.dumps(sorted(names)))
          print('PASS all Staging and Production pins, 51 inherited bindings and D1 schema')
          PY
      - name: Reuse already uploaded exact-SHA Worker version with strict inherited bindings (no new upload)
        run: |
          echo "NEW_STAGING_WORKER_VERSION=1fccb56c-8513-4f6c-a66b-06d9e26f6a22" >> "$GITHUB_ENV"
          echo "Reusing immutable API-managed version; no new upload and no traffic switch until verified"
      - name: Verify 51 inherited bindings and source SHA
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];base='https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/scripts/reply-copilot-api-staging'
          def get(p):
              with urllib.request.urlopen(urllib.request.Request(base+p,headers={'Authorization':'Bearer '+token}),timeout=30) as f:r=json.load(f)
              assert r['success']
              return r['result']
          v=get('/versions/'+os.environ['NEW_STAGING_WORKER_VERSION'])
          names=sorted(b['name'] for b in v['resources']['bindings'])
          previous=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'staging-probe-old-names.json').read_text())
          assert names==previous and len(names)==51 and v['annotations']['workers/commit_sha']==os.environ['SOURCE_SHA']
          assert get('/deployments')['deployments'][0]['id']=='7c561b1d-7baa-46d9-8aac-e1d42fce4acf'
          print('PASS 51 original Staging bindings fully inherited and source verified')
          PY
      - name: Switch Staging Worker to verified version
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,pathlib
          body={'strategy':'percentage','versions':[{'version_id':os.environ['NEW_STAGING_WORKER_VERSION'],'percentage':100}],
                'annotations':{'workers/message':'Sanitized create request outcome recording in Staging only'}}
          pathlib.Path(os.environ['RUNNER_TEMP'],'deploy-probe.json').write_text(json.dumps(body))
          PY
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/deploy-probe.json"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/reply-copilot-api-staging/deployments" > "$RUNNER_TEMP/staging-probe-deployed.json"
          python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path(os.environ['RUNNER_TEMP'],'staging-probe-deployed.json').read_text())
          assert r.get('success') and r.get('result',{}).get('id'),r.get('errors')
          print('PASS Staging Worker deployment accepted')
          PY
      - name: Publish only Staging Pages with existing protected project
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/staging-wrangler/node_modules/.bin/wrangler" pages deploy web/dist             --project-name x-reply-helper-staging             --branch codex/v0.4-credits             --commit-hash "$SOURCE_SHA"             --commit-message "Staging admin-only BoltUtil mainnet probe $SOURCE_SHA"
      - name: Verify Prod isolation, new Staging Worker, Pages and public payment still disabled
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          token=os.environ['CLOUDFLARE_API_TOKEN'];a=os.environ['CLOUDFLARE_ACCOUNT_ID']
          root='https://api.cloudflare.com/client/v4/accounts/'+a
          def get(p):
              with urllib.request.urlopen(urllib.request.Request(root+p,headers={'Authorization':'Bearer '+token}),timeout=30) as f:r=json.load(f)
              assert r.get('success'),p
              return r['result']
          d=get('/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]
          assert d['versions'][0]['version_id']==os.environ['NEW_STAGING_WORKER_VERSION'] and d['versions'][0]['percentage']==100
          s=get('/workers/scripts/reply-copilot-api-staging/settings')
          assert len(s['bindings'])==51 and next(x for x in s['bindings'] if x['name']=='BOLTUTIL_ADMIN_TEST_ENABLED')['text']=='1'
          assert get('/workers/scripts/reply-copilot-api-production/deployments')['deployments'][0]['id']=='86cf104d-33a3-46b8-b165-7e1aaef58dce'
          assert get('/pages/projects/x-reply-helper-production')['canonical_deployment']['id']=='f26991b4-c93e-4301-87e3-dc64ab312c19'
          pages=get('/pages/projects/x-reply-helper-staging')['canonical_deployment']
          assert pages['deployment_trigger']['metadata']['commit_hash']==os.environ['SOURCE_SHA']
          config={v['name']:v for v in s['bindings']}
          assert config['BOLTUTIL_ADMIN_TEST_ENABLED']['text']=='1' and config['BOLTUTIL_ADMIN_TEST_SCHEMA_READY']['text']=='1'
          assert config.get('BOLTUTIL_ENABLED',{}).get('text')!='1'
          assert config.get('BOLTUTIL_STAGING_CREATE_ENABLED',{}).get('text')!='1'
          # Public Staging API gets WAF 403 from GitHub Runner, independently verify after release via Cloudflare Browser Rendering.
          print('PASS Staging admin probe release, public USDT OFF and Production unchanged')
          PY
      - name: Restore previous Worker and Pages if release incomplete
        if: failure()
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os,urllib.request
          token=os.environ.get('CLOUDFLARE_API_TOKEN');a=os.environ.get('CLOUDFLARE_ACCOUNT_ID')
          if not token or not a:raise SystemExit(0)
          root='https://api.cloudflare.com/client/v4/accounts/'+a;h={'Authorization':'Bearer '+token,'Content-Type':'application/json'}
          def call(method,path,body=None):
              q=urllib.request.Request(root+path,method=method,headers=h,data=json.dumps(body).encode() if body else None)
              with urllib.request.urlopen(q,timeout=30) as f:r=json.load(f)
              assert r['success'],r.get('errors')
              return r['result']
          try:
              d=call('GET','/workers/scripts/reply-copilot-api-staging/deployments')['deployments'][0]
              if d['versions'][0]['version_id']==os.environ.get('NEW_STAGING_WORKER_VERSION','--'):
                  call('POST','/workers/scripts/reply-copilot-api-staging/deployments',
                    {'strategy':'percentage','versions':[{'version_id':'0fdc0e97-192b-425a-a0b1-6b26f66a41bd','percentage':100}],
                     'annotations':{'workers/message':'Rollback incomplete admin-only test release'}})
                  print('Restored previous Staging Worker version')
              pages=call('GET','/pages/projects/x-reply-helper-staging')['canonical_deployment']
              if pages['id']!='8ca5d401-ac18-473e-9952-0b1b151f05c6':
                  call('POST','/pages/projects/x-reply-helper-staging/deployments/8ca5d401-ac18-473e-9952-0b1b151f05c6/rollback')
                  print('Restored previous Staging Pages')
          except Exception as e:raise SystemExit('ROLLBACK REQUIRES OPERATOR ATTENTION: '+str(e))
          PY
