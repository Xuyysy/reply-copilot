name: Deploy approved Staging Pages

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full source SHA of a successful Reply Copilot CI run
        required: true
        type: string
        default: '59b1f14856dbb5d0ace54a248643a374ab6dc128'
      ci_run_id:
        description: Successful CI run ID with Staging Pages artifact
        required: true
        type: string
        default: '42473683875'

permissions:
  contents: read
  actions: read

jobs:
  authorize:
    if: >-
      github.repository == 'Xuyysy/reply-copilot' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.STAGING_RELEASE_CONTROL_ISSUE != '' && !github.event.issue.pull_request &&
       format('{0}', github.event.issue.number) == vars.STAGING_RELEASE_CONTROL_ISSUE))
    runs-on: ubuntu-24.04
    outputs:
      source_sha: ${{ steps.request.outputs.source_sha }}
      ci_run_id: ${{ steps.request.outputs.ci_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Authorize exact request before entering Staging environment
        id: request
        env:
          CONTROL_ISSUE: ${{ vars.STAGING_RELEASE_CONTROL_ISSUE }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHECK: request
        run: python3 .github/scripts/staging_release.py
  deploy-staging:
    needs: authorize
    concurrency:
      group: reply-copilot-staging-pages
      cancel-in-progress: false
    # The credentials live only in the staging environment. A manual run on main
    # must be explicitly requested; never execute this job on a feature branch.
    if: needs.authorize.outputs.source_sha != '' && github.ref == 'refs/heads/main' && github.repository == 'Xuyysy/reply-copilot'
    name: Approved Staging Pages ONLY
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: staging
      url: https://staging.x-reply-helper.top
    env:
      SOURCE_SHA: ${{ needs.authorize.outputs.source_sha }}
      CI_RUN_ID: ${{ needs.authorize.outputs.ci_run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify CI and download original digest-checked artifacts
        env:
          RELEASE_CHECK: artifacts
        run: python3 .github/scripts/staging_release.py

      - name: Independently verify all downloaded static files and Staging target
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          root=pathlib.Path.cwd()
          web=(root/'web/dist')
          manifest=json.loads((root/'dist/ci/release-manifest.json').read_text())
          sha=os.environ['SOURCE_SHA']
          allowed={
            'sourceSha':sha,
            'channel':'staging',
            'pagesProject':'x-reply-helper-staging',
            'pagesDomain':'https://staging.x-reply-helper.top',
            'stagingApi':'https://api-staging.x-reply-helper.top',
            'extensionId':'kaaehkpihjenlhjjfjcopkjhegmfmchk'
          }
          for key,value in allowed.items():
              if manifest.get(key)!=value: raise SystemExit(f'Provenance/target mismatch: {key}')
          hashes=(root/'dist/ci/web-files.sha256').read_text().splitlines()
          expected={}
          for entry in hashes:
              matched=re.fullmatch(r'([a-f0-9]{64})  (web/dist/[A-Za-z0-9_./-]+)',entry)
              if not matched: raise SystemExit('Invalid checksum entry')
              digest,rel=matched.groups()
              p=(root/rel).resolve()
              if not p.is_relative_to(web.resolve()) or not p.is_file() or p.is_symlink() or rel in expected:
                  raise SystemExit('Unsafe or duplicate build entry')
              expected[rel]=digest
          actual={}
          for p in web.rglob('*'):
              if p.is_symlink(): raise SystemExit('Build contains symlinks')
              if p.is_file():
                  rel=p.relative_to(root).as_posix()
                  actual[rel]=hashlib.sha256(p.read_bytes()).hexdigest()
          if not actual or actual!=expected or len(actual)!=manifest.get('webFileCount'):
              raise SystemExit('Web build file list or SHA-256 verification failed')
          if not (web/'index.html').is_file() or not (web/'admin/index.html').is_file():
              raise SystemExit('Staging homepage/admin page missing')
          if any(p.name in ('_worker.js','_routes.json') for p in web.rglob('*')):
              raise SystemExit('Unexpected Pages Functions or Worker artifact')
          if not any(allowed['stagingApi'] in p.read_text(errors='replace') for p in web.rglob('*.js')):
              raise SystemExit('Wrong Staging API origin')
          if not any('challenges.cloudflare.com/turnstile/v0/api.js' in p.read_text(errors='replace') for p in web.rglob('*.html')):
              raise SystemExit('Staging Turnstile widget missing')
          print(f'PASS: {len(actual)} immutable static files verified from {sha}')
          PY

      - name: Configure Node.js for trusted deployment tooling
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Main intentionally contains only the approved deployment workflow.
      # Do not run scripts from candidate source; install the reviewed CLI
      # in a throwaway directory to avoid a missing main-branch lockfile.
      - name: Install pinned Wrangler for Pages Direct Upload
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/staging-deploy-tools" --no-save --package-lock=false --no-audit --no-fund wrangler@4.151.0
          "$RUNNER_TEMP/staging-deploy-tools/node_modules/.bin/wrangler" --version

      - name: Check live target, capture rollback and refuse duplicate source
        id: preflight
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_CHECK: deployment
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/x-reply-helper-staging"
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base" > "$RUNNER_TEMP/staging-project.json"
          page=1
          : > "$RUNNER_TEMP/staging-deployment-pages.jsonl"
          while :; do
            curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base/deployments?env=production&page=$page&per_page=25" > "$RUNNER_TEMP/staging-deployment-page.json"
            jq -ec 'select(.success == true) | .result | select(type == "array")' "$RUNNER_TEMP/staging-deployment-page.json" >> "$RUNNER_TEMP/staging-deployment-pages.jsonl"
            count=$(jq '.result | length' "$RUNNER_TEMP/staging-deployment-page.json")
            (( count == 25 )) || break
            (( page++ ))
            (( page <= 100 )) || { echo 'Could not verify complete deployment history'; exit 1; }
          done
          jq -s 'add' "$RUNNER_TEMP/staging-deployment-pages.jsonl" > "$RUNNER_TEMP/staging-deployments.json"
          rollback=$(python3 .github/scripts/staging_release.py)
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"
          echo "- Rollback deployment recorded before upload: $rollback" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy only x-reply-helper-staging Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          "$RUNNER_TEMP/staging-deploy-tools/node_modules/.bin/wrangler" pages deploy web/dist \
            --project-name x-reply-helper-staging \
            --branch codex/v0.4-credits \
            --commit-hash "$SOURCE_SHA" \
            --commit-message "Approved RC1 Staging Pages $SOURCE_SHA"

      - name: Confirm live Staging deployment
        id: live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/x-reply-helper-staging"
          for attempt in {1..10}; do
            live=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$base" | jq -r --arg sha "$SOURCE_SHA" '
              .result.canonical_deployment
              | select(.deployment_trigger.metadata.commit_hash == $sha and .latest_stage.status == "success")
              | .id')
            if [[ "$live" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "id=$live" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 3
          done
          echo 'Uploaded deployment did not become the successful canonical Staging version in time.'
          exit 1

      - name: Deployment summary
        if: success()
        env:
          DEPLOYMENT_ID: ${{ steps.live.outputs.id }}
          ROLLBACK_ID: ${{ steps.preflight.outputs.rollback }}
          REQUEST_ACTOR: ${{ github.actor }}
          COMMENT_ID: ${{ github.event.comment.id }}
        shell: bash
        run: |
          echo "### Staging Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: x-reply-helper-staging" >> "$GITHUB_STEP_SUMMARY"
          echo "- Domain: https://staging.x-reply-helper.top" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source SHA: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "- CI run: $CI_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployment ID: $DEPLOYMENT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Rollback deployment: $ROLLBACK_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Requested by: $REQUEST_ACTOR (comment ID: ${COMMENT_ID:-manual})" >> "$GITHUB_STEP_SUMMARY"
