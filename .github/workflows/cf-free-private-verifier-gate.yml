name: CF Free private verifier offline security gate
on:
  push:
    branches: ['chatgpt/cf-free-private-verifier-candidate-20261125']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked local runtime
        run: npm --prefix api ci
      - name: Test private RPC, long keys, rollback and dry-run
        run: |
          npm --prefix api run typecheck
          node --test tests/cf-free-readiness.test.mjs api/tests/cf-free-migration-evidence.test.mjs api/tests/cf-free-private-release-gate.test.mjs api/tests/cf-free-private-verifier.test.mjs api/tests/cf-free-real-password-rpc.test.mjs api/tests/cf-free-password-do.test.mjs
      - name: Rebuild exact locked RustCrypto artifact and collect dependency license evidence
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.1 --profile minimal --target wasm32-unknown-unknown
          cd api/prototypes/cf-free-rustcrypto-wasm
          echo '09a6085dc9e2becfde66d4c013a8f5b2423800513ca8b3af6a6e37f6e632ccc3  Cargo.lock' | sha256sum -c -
          cargo +1.85.1 build --locked --release --target wasm32-unknown-unknown
          echo '2d34ed3d829ebff018cf3afaba063c9cfd90d14b00db938d082fa862e74ce838  target/wasm32-unknown-unknown/release/xrh_legacy_kdf_lab.wasm' | sha256sum -c -
          cmp target/wasm32-unknown-unknown/release/xrh_legacy_kdf_lab.wasm ../cf-free-private-verifier/src/legacy-210k.wasm
          cargo +1.85.1 metadata --locked --format-version 1 --filter-platform wasm32-unknown-unknown > "$RUNNER_TEMP/private-verifier-dependencies.json"
          python3 - <<'PY'
          import json,os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'private-verifier-dependencies.json'
          for pkg in sorted(json.loads(p.read_text())['packages'],key=lambda p:p['name']):
              if pkg['source']:
                  print('CF_FREE_RUST_LICENSE '+json.dumps({k:pkg[k] for k in ('name','version','license','license_file','repository')}))
          PY

  npm-advisory-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Collect locked npm advisory evidence without installing or fixing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/npm-advisories"
          for project in api web; do
            for scope in all production; do
              args=(--json --package-lock-only --audit-level=low)
              if [[ "$scope" == production ]]; then args+=(--omit=dev); fi
              set +e
              npm --prefix "$project" audit "${args[@]}" > "$RUNNER_TEMP/npm-advisories/$project-$scope.json"
              rc=$?
              set -e
              python3 - "$RUNNER_TEMP/npm-advisories/$project-$scope.json" "$project" "$scope" "$rc" <<'PY'
          import json,sys
          p,project,scope,rc=sys.argv[1:]
          d=json.load(open(p))
          if d.get('error') or not isinstance(d.get('vulnerabilities'),dict) or not isinstance(d.get('metadata',{}).get('vulnerabilities'),dict):
              raise SystemExit('Incomplete npm audit evidence')
          print('CF_FREE_NPM_AUDIT '+json.dumps({'project':project,'scope':scope,'exit':int(rc),'counts':d['metadata']['vulnerabilities'],'packages':[{ 'name':k,'severity':v.get('severity'),'direct':v.get('isDirect'),'fixAvailable':v.get('fixAvailable'),'advisories':[{ 'title':a.get('title'),'url':a.get('url'),'range':a.get('range')} for a in v.get('via',[]) if isinstance(a,dict)]} for k,v in d['vulnerabilities'].items()]}))
          if int(rc) not in (0,1): raise SystemExit('Unexpected npm audit exit')
          PY
            done
          done
      - name: Preserve advisory evidence for manual triage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cf-free-npm-advisories
          path: ${{ runner.temp }}/npm-advisories
          retention-days: 14
