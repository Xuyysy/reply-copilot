<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史变化 · 互关助手 V2</title><link rel="stylesheet" href="../../content/design-tokens.css"><link rel="stylesheet" href="workbench.css"><link rel="stylesheet" href="history.css"></head>
<body><main><header><a href="workbench.html">← 返回互关工作台</a><h1>历史变化分析</h1><p>仅合成数据研发预览。名单中消失不等同于主动取关。比较范围为本地保留的完整模拟快照。</p></header>
<section><h2>历史趋势</h2><p id="history-status" role="status" aria-live="polite">读取中…</p><div class="scroll"><table><thead><tr><th>快照时间（本机）</th><th>粉丝</th><th>关注</th></tr></thead><tbody id="trend"></tbody></table></div><button id="refresh" disabled>刷新历史</button></section>
<section><h2>比较两个快照</h2><div class="actions"><label>较早快照 <select id="older" disabled></select></label><label>较新快照 <select id="newer" disabled></select></label><button id="compare" disabled>比较</button></div><p id="comparison-meta"></p><div id="metrics" class="metrics"></div><p id="coverage"></p></section>
<section><h2>变化名单</h2><div id="change-cards" class="metrics"></div><div class="actions"><label>变化类型 <select id="change-kind"><option value="all">全部变化</option></select></label><input id="change-query" type="search" placeholder="搜索 ID、昵称、用户名"><button id="csv" disabled>导出筛选名单 CSV</button></div><p id="change-count" aria-live="polite">暂无比较</p><div class="scroll"><table><thead><tr><th>变化</th><th>账号</th><th>变化前</th><th>变化后</th></tr></thead><tbody id="change-rows"></tbody></table></div><div class="actions"><button id="history-prev" disabled>上一页</button><button id="history-next" disabled>下一页</button></div></section></main><script type="module" src="history-page.js"></script></body></html>
