<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>互关助手 V2 · 本地研发预览</title><link rel="stylesheet" href="../../content/design-tokens.css"><link rel="stylesheet" href="workbench.css"></head><body><main><header><h1>互关助手 V2</h1><p>本地研发预览 · 仅合成数据，不连接真实 X 账号</p></header><section><label>模拟名单每类人数 <select id="size"><option>100</option><option>1000</option><option>10000</option><option>30000</option><option>50000</option></select></label><div class="actions"><button id="start">开始模拟同步</button><button id="resume">恢复进度</button><button id="pause">暂停</button><button id="discard">清除未完成任务</button><button id="purge">清除模拟数据</button></div><p id="status" role="status" aria-live="polite">读取本地数据…</p></section><section><h2>最近完整模拟结果</h2><p id="summary">暂无数据</p><p id="changes"></p><div class="actions"><select id="kind" aria-label="关系类型"><option value="mutual">互关</option><option value="notFollowingBack">没回关我</option><option value="iHaveNotFollowedBack">我没回关</option></select><input id="search" type="search" placeholder="搜索昵称或用户名"><select id="verified" aria-label="认证"><option value="all">全部认证</option><option value="blue">蓝 V</option><option value="unknown">未知</option></select></div><p id="matches"></p><ul id="list"></ul><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button><button id="export">导出筛选名单 CSV</button></div></section></main><script type="module" src="workbench.js"></script></body></html>
