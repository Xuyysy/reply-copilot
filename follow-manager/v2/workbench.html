<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>互关助手 V2 · 本地研发预览</title><link rel="stylesheet" href="../../content/design-tokens.css"><link rel="stylesheet" href="workbench.css"></head><body><main><header><h1>互关助手 V2</h1><p><a href="history.html">查看历史变化分析 →</a></p><p>本地研发预览 · 仅合成数据，不连接真实 X 账号</p></header><section><label>模拟名单每类人数 <select id="size"><option>100</option><option>1000</option><option>10000</option><option>30000</option><option>50000</option></select></label><div class="actions"><button id="start">开始模拟同步</button><button id="resume">恢复进度</button><button id="pause">暂停</button><button id="discard">清除未完成任务</button><button id="purge">清除模拟数据</button></div><p id="status" role="status" aria-live="polite">读取本地数据…</p></section><section><h2>最近完整模拟结果</h2><p id="summary">暂无数据</p><p id="changes"></p><div class="actions"><select id="kind" aria-label="关系类型"><option value="mutual">互关</option><option value="notFollowingBack">没回关我</option><option value="iHaveNotFollowedBack">我没回关</option><option value="protected">保护名单</option></select><input id="search" type="search" placeholder="搜索昵称或用户名"><select id="verified" aria-label="认证"><option value="all">全部认证</option><option value="blue">蓝 V</option><option value="notBlue">确认非蓝 V</option><option value="gold">金 V</option><option value="grey">灰 V</option><option value="none">无认证</option><option value="unknown">未知</option></select><select id="sort" aria-label="排序"><option value="followers">粉丝数</option><option value="following">关注数</option><option value="ratio">粉丝关注比</option><option value="handle">用户名</option></select><label>粉丝最少 <input id="min-followers" type="number" min="0" step="1" placeholder="不限"></label><label>粉丝最多 <input id="max-followers" type="number" min="0" step="1" placeholder="不限"></label><label><input id="hide-protected" type="checkbox"> 隐藏保护账号</label></div><p id="matches"></p><ul id="list"></ul><div class="actions"><button id="prev">上一页</button><button id="next">下一页</button><button id="export">导出筛选名单 CSV</button></div></section></main><script type="module" src="workbench.js"></script></body></html>
