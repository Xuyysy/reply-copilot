<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实接口单页诊断</title><link rel="stylesheet" href="../../content/design-tokens.css"><link rel="stylesheet" href="workbench.css"></head><body><main><header><h1>真实接口单页诊断</h1><p>开发验收专用。仅在你具有相应数据访问授权时使用。读取当前 DevTools 标签页中由你正常操作网页产生的一次关注或粉丝响应；不发请求、不读凭据、不保存或上传名单。不是自动同步，也不能验证当前登录身份。</p></header><section><label>本人账号的稳定数字 ID <input id="owner" inputmode="numeric" maxlength="20" autocomplete="off"></label><label>接口类型 <select id="kind"><option value="following">关注</option><option value="followers">粉丝</option></select></label><label><input type="checkbox" id="authorized"> 我已确认具有该数据来源的访问授权，仅测试自己的账号。</label><div class="actions"><button id="start">读取下一次响应（60 秒）</button><button id="stop" disabled>停止</button><button id="clear">清除结果</button><button id="copy" disabled>复制脱敏报告</button></div><p id="status" role="status" aria-live="polite">未启动；请先在有授权的 X 标签页打开开发者工具。</p><pre id="result" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre><p>启动后在原网页正常打开相应名单或手动加载下一页。若页面导航使任务停止，在新页面重新启动；关闭或隐藏此诊断面板也会停止。</p></section></main><script type="module" src="response-probe-ui.js"></script></body></html>
