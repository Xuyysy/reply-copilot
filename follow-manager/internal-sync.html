<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>互关助手 · 快速同步测试</title>
  <link rel="stylesheet" href="../content/design-tokens.css">
  <link rel="stylesheet" href="manager.css">
  <link rel="stylesheet" href="web-scan.css">
  <link rel="stylesheet" href="internal-sync.css">
</head>
<body>
<main class="container">
  <header class="page-heading">
    <img src="../icons/icon-48.png" width="44" height="44" alt="">
    <div>
      <p class="eyebrow">X REPLY HELPER · 互关助手</p>
      <h1>互关助手 <span class="experimental">测试模式</span></h1>
      <p class="muted">免数据归档 · 使用当前 X 登录状态 · 本地保存结果</p>
    </div>
  </header>
  <section class="panel follow-main" aria-labelledby="internal-heading">
    <div class="heading-line">
      <h2 id="internal-heading">我的关注关系</h2>
      <div class="actions internal-actions">
        <button id="internal-start" type="button" class="primary">开始同步</button>
        <button id="internal-cancel" type="button" class="secondary" disabled>停止</button>
      </div>
    </div>
    <details id="internal-settings" open>
      <summary>账号与同步设置</summary>
      <p class="intro">通过 X 网页内部接口只读获取自己的关注与粉丝，结果仅保存在本机。该测试方式可能因接口变化或限流而停止。</p>
      <label class="field" for="internal-owner">当前登录的 X 用户名
        <input id="internal-owner" maxlength="16" autocomplete="off" placeholder="@yourhandle">
      </label>
      <label class="confirmation">
        <input type="checkbox" id="internal-consent">
        我确认同步的是自己的 X 账号，并同意使用此测试方式读取关注关系。
      </label>
      <div class="actions">
        <button id="internal-reset" type="button" class="secondary">清除未完成进度</button>
        <button id="internal-clear" type="button" class="danger">清除本地记录</button>
      </div>
    </details>
    <div id="internal-loading" class="follow-loading" role="status" aria-live="polite" hidden>
      <span class="loading-spinner" aria-hidden="true"></span>
      <div class="loading-description">
        <strong id="internal-loading-title">正在同步关注关系…</strong>
        <span id="internal-elapsed" class="elapsed">已用时间 00:00</span>
      </div>
    </div>
    <p id="internal-status" class="feedback" role="status" aria-live="polite">正在读取本地记录…</p>
  </section>
  <section class="panel" id="internal-results" hidden aria-labelledby="internal-results-heading">
    <div class="heading-line">
      <h2 id="internal-results-heading">关注关系</h2>
      <span id="internal-result-badge" class="tag">本机记录</span>
    </div>
    <p id="internal-coverage-note" class="notice">结果来自已获取的账号，可能不完整。</p>
    <button id="internal-history-toggle" type="button" class="secondary" hidden>查看上次完整结果</button>
    <p id="internal-snapshot-meta" class="muted small"></p>
    <p id="internal-changes" class="snapshot-changes" hidden></p>
    <div class="stats">
      <div><strong id="internal-not-following-back">0</strong><span>未回关我</span></div>
      <div><strong id="internal-i-not-followed-back">0</strong><span>我未回关</span></div>
    </div>
    <nav class="tabs" aria-label="关注关系分类">
      <button class="tab" type="button" data-internal-kind="notFollowingBack" aria-pressed="true">未回关我</button>
      <button class="tab" type="button" data-internal-kind="iHaveNotFollowedBack" aria-pressed="false">我未回关</button>
    </nav>
    <div class="list-tools">
      <label class="field">搜索用户名<input id="internal-filter" type="search" placeholder="输入 @用户名"></label>
      <label class="field verified-selector">认证状态
        <select id="internal-verified" aria-label="按蓝 V 认证状态筛选">
          <option value="all">全部账号</option>
          <option value="blue">仅看蓝 V</option>
          <option value="not-blue">确认非蓝 V</option>
          <option value="unknown">认证状态未知</option>
        </select>
      </label>
      <button id="internal-export" type="button" class="secondary">导出 CSV</button>
    </div>
    <p id="internal-result-count" class="muted small" role="status"></p>
    <div id="internal-result-list" class="result-list" role="list"></div>
    <div class="pagination">
      <button id="internal-prev" type="button" class="secondary">上一页</button>
      <span id="internal-page-info">1 / 1</span>
      <button id="internal-next" type="button" class="secondary">下一页</button>
    </div>
  </section>
  <p class="back-link"><a href="manager.html">← 返回互关助手</a></p>
  <footer>每次仅同步一小批账号，结果保存在本机，下次可继续补齐。遇到平台限制会停止。</footer>
</main>
<script type="module" src="internal-sync-ui.js"></script>
</body>
</html>
