<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动助手 · X Reply Helper</title><link rel="stylesheet" href="account-workbench.css"></head><body><main><header><div><p class="muted">X Reply Helper</p><h1>互动助手</h1><p id="owner" class="muted">正在确认账号…</p></div><div class="toolbar"><button id="refresh" class="primary" type="button">刷新</button><details class="settings"><summary>设置</summary><div><p class="muted" id="source-note">数据保存在本机。</p><button id="export" disabled>导出 CSV</button><button id="clear" disabled>清除本地记录</button></div></details></div></header><p id="status" class="status" role="status">正在读取缓存…</p><section id="content" hidden><div class="cards"><div class="card"><span class="muted">互动人数</span><strong id="people-count">—</strong></div><div class="card"><span class="muted">互动关系记录</span><strong id="event-count">—</strong></div><div class="card"><span class="muted">回复</span><strong id="reply-count">—</strong></div><div class="card"><span class="muted">点赞</span><strong id="like-count">—</strong></div></div><div class="columns"><section class="panel"><h2>互动排行</h2><div class="toolbar"><input id="search" type="search" placeholder="搜索用户名" maxlength="40" aria-label="搜索用户"><select id="type" aria-label="互动类型"><option value="all">全部互动</option><option value="reply">回复</option><option value="like">点赞</option><option value="repost">转发</option><option value="quote">引用</option><option value="mention">提及</option></select><select id="days" aria-label="时间范围"><option value="">全部时间</option><option value="7">最近7天</option><option value="30">最近30天</option><option value="90">最近90天</option></select><select id="sort" aria-label="排序"><option value="count">互动次数</option><option value="weighted">加权</option><option value="recent">近期活跃</option></select></div><ol class="list" id="ranking"></ol><div id="empty" class="empty" hidden>暂无已确认互动记录</div><div class="pagination" id="pagination" hidden><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></div></section><section class="panel"><h2 id="detail-title">互动明细</h2><p id="detail-empty" class="muted">选择一位用户查看互动记录。</p><ol class="list" id="detail"></ol><button id="more" hidden>更多</button></section></div><details class="foot"><summary>数据覆盖与更新时间</summary><p id="quality"></p></details></section></main><script type="module" src="interaction-workbench.js"></script></body></html>
