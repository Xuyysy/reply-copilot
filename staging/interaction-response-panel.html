<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>互动接口采集 · Staging</title><link rel="stylesheet" href="account-workbench.css"></head><body><main><h1>互动接口采集（Staging）</h1><p>仅采集已授权 X 网页正常产生的响应。不会主动请求 X，不会读取或导出凭据；样本不代表完整历史。</p><p>先从该 X 标签页的扩展侧边栏打开互动助手，返回 X 标签页，再打开本面板。</p><label>来源 <select id="source"><option value="notification">通知</option><option value="post">搜索帖子</option></select></label> <label>本次上限 <select id="max-pages"><option value="1">1 页（诊断）</option><option value="5">5 页（连续采集）</option></select></label><p><label><input id="authorized" type="checkbox"> 我确认有权读取并在本机保存本次响应中的互动关系</label></p><div class="toolbar"><button id="start" class="primary">开始授权采集</button><button id="stop" disabled>停止</button></div><p id="status" role="status">未启动</p><p class="muted">请先打开通知或搜索页面，再启动；在同一页面滚动加载下一页，最多 60 秒或所选页数。处理期间重叠响应可能跳过，不自动补抓。切换页面、刷新或关闭面板会停止监听。完成后在互动助手点击“读取本地记录”。</p><pre id="report"></pre></main><script src="interaction-interface.js"></script><script type="module" src="interaction-response-panel.js"></script></body></html>
