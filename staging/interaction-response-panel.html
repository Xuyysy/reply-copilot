<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>互动接口采集 · Staging</title><link rel="stylesheet" href="account-workbench.css"></head><body><main><h1>互动接口采集（Staging）</h1><p>仅采集已授权 X 网页下一条正常读取响应。不会主动请求 X，不会读取或导出凭据，单页数据不是完整历史。</p><p>先从该 X 标签页的扩展侧边栏打开互动助手，返回 X 标签页，再打开本面板。</p><label>来源 <select id="source"><option value="notification">通知</option><option value="post">搜索帖子</option></select></label><p><label><input id="authorized" type="checkbox"> 我确认有权读取并在本机保存本次响应中的互动关系</label></p><div class="toolbar"><button id="start" class="primary">等待下一条响应</button><button id="stop" disabled>停止</button></div><p id="status" role="status">未启动</p><p class="muted">启动后正常打开通知或搜索结果，最多等待 60 秒。完成后在互动助手点击“读取本地记录”。</p><pre id="report"></pre></main><script src="interaction-interface.js"></script><script type="module" src="interaction-response-panel.js"></script></body></html>
