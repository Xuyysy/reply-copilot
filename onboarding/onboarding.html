<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>欢迎使用 x-Reply-Helper</title><link rel="stylesheet" href="onboarding.css"></head><body><main><p class="brand"><img src="../icons/icon-32.png" alt="">x-Reply-Helper</p><div class="steps"><span class="active">1</span><span>2</span><span>3</span></div>
<section data-step="0"><h1>欢迎使用 x-Reply-Helper</h1><p>让每一条 X 回复更自然、更像你自己。</p><p>注册并验证邮箱，免费获得 200 次 AI 生成，不主动过期。</p><ul><li>自然表达</li><li>定制个人风格</li><li>由你掌控发送</li></ul><p class="muted">x-Reply-Helper 只提供草稿。由你检查、编辑，并决定是否发送。</p><div id="welcome-actions" class="actions"><button id="open-register">免费注册并连接</button><button id="open-login" class="secondary">已有账号？登录连接</button></div><div id="connected-actions" class="actions hidden"><button id="start-using">设置回复偏好</button><button id="open-options" class="secondary">打开设置</button></div><p id="welcome-status" class="muted" role="status">正在检查插件账户…</p><p class="muted">AI 由平台云端提供，无需自行配置密钥。</p></section>
<section data-step="1" class="hidden"><h1>设置你的风格</h1><p>选择几项偏好，之后也可以在设置中心修改。</p><label>基础语气<select id="tone"><option value="relaxed_friendly">轻松友好</option><option value="balanced_thoughtful">平和有思考</option><option value="confident_direct">自信直接</option></select></label><label>回复语言<select id="language"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">English</option></select></label><label>回复长度<select id="length"><option value="short">简短</option><option value="medium">适中</option><option value="adaptive" selected>自适应</option></select></label><label>幽默程度<select id="humor"><option value="low">低</option><option value="medium" selected>中</option><option value="high">高</option></select></label><div class="actions"><button class="secondary" data-back>上一步</button><button data-next>继续</button><button class="text" data-skip>跳过风格设置</button></div></section>
<section data-step="2" class="hidden"><h1>准备好了</h1><p>如已连接账户，打开 X 帖子的回复框即可获取草稿；发送前请自行检查。跳过的风格设置可稍后在设置中心完成。</p><div class="actions"><button id="finish">开始使用</button><button id="open-options" class="secondary">打开设置</button></div></section>
<footer><a href="../options/options.html">打开完整设置中心</a></footer></main><script type="module" src="onboarding.js"></script></body></html>
