[package]
name = "xrh-legacy-kdf-lab"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
pbkdf2 = { version = "=0.12.2", default-features = false, features = ["hmac"] }
sha2 = { version = "=0.10.9", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
