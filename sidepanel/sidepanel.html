<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>x-Reply-Helper</title><link rel="stylesheet" href="sidepanel.css"><link rel="stylesheet" href="../content/momentum.css"></head>
<body>
  <header><img class="brand-icon" src="../icons/icon-48.png" alt=""><div><h1>x-Reply-Helper</h1><p>快捷控制中心</p></div><button id="settings" class="icon-button" aria-label="设置" title="设置">⚙</button></header>
  <main>
    <div id="momentum-control" class="dashboard-card"></div>
    <section id="dashboard">
      <div class="dashboard-heading"><h2>我的账户</h2><button id="account-refresh" class="text-button">刷新</button></div>
      <div class="dashboard-card"><strong id="account-name">正在读取账户…</strong><p id="account-summary">余额由官网服务确认</p><div id="quota-row" class="quota-row hidden"><div><strong id="quota-total">—</strong><span>总剩余</span></div><div><strong id="quota-free">—</strong><span>免费</span></div><div><strong id="quota-paid">—</strong><span>付费</span></div></div><div id="account-buttons" class="dashboard-actions"><button id="connect-register" class="button">免费注册并连接</button><button id="connect-login" class="button secondary">已有账号登录</button><button id="check-binding" class="button secondary hidden">查看绑定状态</button></div></div>
      <div class="dashboard-card"><h2>本地使用统计</h2><div class="quota-row"><div><strong id="stat-week">0</strong><span>近 7 天生成</span></div><div><strong id="stat-all">0</strong><span>累计生成</span></div><div><strong id="stat-copy">0</strong><span>已复制建议</span></div></div><p class="muted-note">仅统计本机事件，不代表服务端扣费或实际发送。</p></div>
      <div class="dashboard-card supported-flow"><strong>在 X 回复框中生成建议</strong><p>请在 X 帖子下方点击「回复」，再使用回复悬浮窗生成和编辑建议。侧栏只管理账户、设置与互动势能，不会在后台生成回复。</p></div>
      <details class="dashboard-card"><summary>快捷回复设置</summary><label class="setting-row">默认风格<select id="quick-style"><option value="natural">自然</option><option value="light_humor">幽默</option><option value="thoughtful">观点</option></select></label><label class="setting-row">回复语言<select id="quick-language"><option value="auto">自动识别</option><option value="zh">中文</option><option value="en">English</option></select></label><label class="setting-row">回复长度<select id="quick-length"><option value="short">简短</option><option value="medium">适中</option><option value="adaptive">自适应</option></select></label><label class="setting-row">幽默程度<select id="quick-humor"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></label><label class="setting-row">自动生成建议<input id="quick-auto" type="checkbox" role="switch"></label><p id="quick-save-status" class="muted-note" role="status"></p></details>
      <div class="dashboard-card"><h2>快速前往</h2><div class="dashboard-actions"><button id="nav-website" class="button secondary">打开官网</button><button id="nav-account" class="button secondary">我的账户</button><button id="nav-pricing" class="button secondary">充值套餐</button><button id="nav-guide" class="button secondary">使用指南</button></div></div>
    </section>
  </main>
  <footer><button id="footer-settings" class="text-button">设置</button></footer>
  <script src="../content/momentum-presenter.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body></html>
